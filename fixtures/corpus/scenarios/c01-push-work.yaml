# C1 — baseline (P1). One formula, one unit; the mass is a red herring.
id: c01-push-work
title: Work pushing a mass on a frictionless surface
source: { document: PHYS161_Exam2, labels: [ P1 ] }
section: Work
tags: [ work, baseline ]
narrative: >-
  A mass of {m:unit} is pushed (not pulled) horizontally a distance of {d:unit} by a force of
  {F:unit} on a horizontal frictionless surface.
vars:
  - {
      name: m,
      kind: range,
      min: 20,
      max: 90,
      step: 0.5,
      decimals: 1,
      unit: kg,
      label: mass (red herring)
    }
  - { name: d, kind: range, min: 1, max: 5, step: 0.1, decimals: 1, unit: m, label: distance }
  - { name: F, kind: range, min: 40, max: 100, step: 0.1, decimals: 1, unit: N, label: force }
parts:
  - id: work
    prompt: "Determine the work necessary to push the mass. {_0}{_u}"
    answer: F * d
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 1
canonical:
  vars: { m: 66.5, d: 2.6, F: 73.8 }
  parts:
    - { id: work, answer: 191.88, unit: J, source: P1 }
