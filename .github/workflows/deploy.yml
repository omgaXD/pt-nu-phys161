name: Deploy

# The deployed quiz shows every problem and answer to anyone with the URL.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a half-done deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Build, lint, typecheck and tests
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
          pnpm lint
          pnpm -r typecheck
          pnpm -r test

      # Every authored problem reproduces its printed answer, and every source
      # problem is playable (authored or fixed).
      - name: Content checks
        run: |
          pnpm pt check --root fixtures
          pnpm pt check --root content/sets
          pnpm pt coverage --root content/sets --strict

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      # GHCR image names must be lowercase (the owner is omgaXD).
      - id: name
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.repo }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}/
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '~/pt-quiz' }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy

      - name: Check configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          missing=0
          for v in SSH_HOST SSH_USER SSH_KNOWN_HOSTS SSH_PRIVATE_KEY GHCR_PAT DOMAIN; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set in the production environment"
              missing=1
            fi
          done
          # DEPLOY_DIR is expanded by the remote shell (so ~ works); keep it to safe characters.
          re='^~?[A-Za-z0-9._/-]+$'
          if ! [[ $DEPLOY_DIR =~ $re ]]; then
            echo "::error::DEPLOY_DIR may only contain letters, digits, . _ / - and a leading ~"
            missing=1
          fi
          exit $missing

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
          EOF

      - name: Log in to GHCR on the server
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: printf '%s' "$GHCR_PAT" | ssh prod "docker login ghcr.io -u $GHCR_USERNAME --password-stdin"

      - name: Build the server's compose bundle
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          umask 077
          mkdir bundle
          cp deploy/docker-compose.prod.yml bundle/docker-compose.yml
          {
            echo "# Written by .github/workflows/deploy.yml and overwritten on every deploy."
            echo "# Change values in the GitHub 'production' environment, not here."
            for v in IMAGE DOMAIN; do
              val=${!v}
              [ -n "$val" ] || continue
              # Single quotes stop compose from interpolating $ in values; they can't be escaped.
              if [[ $val == *"'"* || $val == *$'\n'* ]]; then
                echo "::error::$v must not contain single quotes or newlines" >&2
                exit 1
              fi
              printf "%s='%s'\n" "$v" "$val"
            done
          } > bundle/.env

      - name: Upload compose bundle
        run: tar -C bundle -cf - docker-compose.yml .env | ssh prod "mkdir -p $DEPLOY_DIR && tar -xf - -C $DEPLOY_DIR"

      - name: Start the new image
        run: |
          ssh prod "bash -s -- $DEPLOY_DIR $IMAGE" <<'EOF'
          # Braces make bash read the whole script before running it, so no
          # command can consume the rest of it from stdin.
          {
          set -euo pipefail
          cd "$1"
          image=$2
          chmod 600 .env

          docker compose pull
          docker compose up -d --remove-orphans

          # Fail the deploy if the server crashes on startup (e.g. a bad Caddyfile).
          sleep 10
          state=$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$(docker compose ps -aq app)")
          if [ "$state" != "running 0" ]; then
            echo "::error::app is not running after the deploy (status, restarts: $state)"
            docker compose logs --tail 50 app
            exit 1
          fi

          # Drop older tags of this image; any of them can be pulled again for a rollback.
          docker images "${image%:*}" --format '{{.Repository}}:{{.Tag}}' \
            | grep -vxF "$image" | xargs -r docker rmi || true

          if command -v systemctl >/dev/null && ! systemctl is-enabled --quiet docker; then
            echo "::warning::docker.service is not enabled on the server, so the quiz won't start after a reboot. Run: sudo systemctl enable docker"
          fi
          }
          EOF
