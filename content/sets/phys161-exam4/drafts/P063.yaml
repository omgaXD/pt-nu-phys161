number: 63
section: 1st Law of Thermodynamics
source: { document: PHYS161_Exam4, file: PHYS161 Exam 4.html }
raw: A cylinder with a frictionless, movable piston contains a quantity of helium gas. Initially the
  gas is at a pressure of 0.92×10<sup>5</sup> Pa, has a temperature of 303 K, and occupies a volume
  of 1.23 L. The gas then undergoes two processes. In the first, the gas is heated and the piston is
  allowed to move to keep the temperature equal to 303 K. This continues until the pressure reaches
  2.06×10<sup>4</sup> Pa. In the second process, the gas is compressed at constant pressure until it
  returns to its original volume 1.23 L. Assume that the gas may be treated as ideal. Find the
  temperature at the end of the second process. 1 L = 0.001 m<sup>3</sup>(67.845652173913 K)
text: A cylinder with a frictionless, movable piston contains a quantity of helium gas. Initially
  the gas is at a pressure of 0.92×10^5 Pa, has a temperature of 303 K, and occupies a volume of
