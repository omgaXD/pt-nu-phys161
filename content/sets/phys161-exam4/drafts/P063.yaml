  allowed to move to keep the temperature equal to 303 K. This continues until the pressure reaches
  2.06×10^4 Pa. In the second process, the gas is compressed at constant pressure until it returns
  to its original volume 1.23 L. Assume that the gas may be treated as ideal. Find the temperature
  at the end of the second process. 1 L = 0.001 m^3(67.845652173913 K)
