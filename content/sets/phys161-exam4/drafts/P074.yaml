  temperature are allowed to rise (line DA) until the temperature reaches its original value
  (T<sub>A</sub> = T<sub>B</sub>). In the process BDA, calculate the absolute value of the amount of
  total heat involved in these processes.

  1 atm = 101325 Pa,

  1 L = 0.001 m<sup>3</sup>. (1925.175 J)
