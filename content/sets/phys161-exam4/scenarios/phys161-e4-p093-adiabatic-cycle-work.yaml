# P93 — cycle acba: ac at constant pressure, W_ac = n R (T_c − T_a); cb adiabatic, W_cb =
# −n C_V (T_b − T_c) with C_V = C_p − R; ba at constant volume, W_ba = 0. The answer is the
# magnitude of the sum. On a true adiabat T_b = T_c (T_c / T_a)^(γ−1) (V_c / V_a = T_c / T_a,
# γ = C_p / C_V); the printed T_b is that value rounded to a kelvin plus a small offset (−2…+2 K),
# because the source's T_b = 598 K sits 2 K off the adiabat through its T_a and T_c.
id: phys161-e4-p093-adiabatic-cycle-work
title: Work of a cycle with an adiabatic stage
source: { document: PHYS161_Exam4, labels: [ P93 ] }
section: 1st Law of Thermodynamics
tags: [ first-law, work, adiabatic, cycle ]
figure:
  id: acba-cycle
  src: figures/unnamed_p-J8.png
  alt: >-
    A pV diagram of a three-stage cycle. From state a an arrow runs horizontally right to state c;
    from c a curve rises up and to the left to state b, directly above a; from b an arrow runs
    straight down back to a.
narrative: >-
  {n} moles of an ideal gas are taken around the cycle acba. For this gas, $C_p$ = {Cp:unit}.
  Process ac is at constant pressure, process ba is at constant volume, and process cb is adiabatic.
  The temperatures of the gas in states a, c and b are $T_a = {Ta:unit}$, $T_c = {Tc:unit}$, and
  $T_b = {Tb:unit}$. {@fig}
vars:
  - { name: n, kind: range, min: 2, max: 5, step: 1, label: moles of gas }
  - { name: Ta, kind: range, min: 280, max: 320, step: 1, unit: K, label: temperature at a }
  - { name: Tc, kind: range, min: 430, max: 560, step: 1, unit: K, label: temperature at c }
  - {
      name: dTb,
      kind: range,
      min: -2,
      max: 2,
      step: 1,
      unit: K,
      label: offset of T_b from the adiabat
    }
derived:
  - { name: R, expr: "8.31", unit: J/(mol K) }
  - { name: Cp, expr: "29.1", unit: J/(mol K) }
  - { name: Tb, expr: "round(Tc * (Tc / Ta)^(Cp / (Cp - R) - 1)) + dTb", unit: K }
parts:
  - id: cycle-work
    prompt: >-
      Calculate the magnitude of the total work for the cycle. The universal gas constant is $R =
      {R:unit}$. {_0}{_u}
    answer: abs(n * R * (Tc - Ta) - n * (Cp - R) * (Tb - Tc))
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 4
canonical:
  vars: { n: 3, Ta: 298, Tc: 489, dTb: 2, R: 8.31, Cp: 29.1, Tb: 598 }
  parts:
    - { id: cycle-work, answer: 2036.7, unit: J, source: P93 }
