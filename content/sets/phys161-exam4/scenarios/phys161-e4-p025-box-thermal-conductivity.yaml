# P25 — conduction through the box walls: P = k A ΔT / d, so k = P d / (A ΔT). The thickness is
# given in cm.
id: phys161-e4-p025-box-thermal-conductivity
title: Thermal conductivity of a box wall
source: { document: PHYS161_Exam4, labels: [ P25 ] }
section: Temperature and heat
tags: [ heat-conduction, thermal-conductivity ]
narrative: >-
  A power input of {P:unit} is required to keep the interior surface of the box of an apparatus
  {dT:unit} above the temperature of the outer surface. The total area of the box is {A:unit}, and
  the wall thickness is {d:unit}.
vars:
  - { name: P, kind: range, min: 100, max: 250, step: 1, unit: W, label: power input }
  - { name: dT, kind: range, min: 30, max: 80, step: 1, unit: °C, label: temperature difference }
  - { name: A, kind: range, min: 1.00, max: 3.50, step: 0.05, unit: m^2, label: total area }
  - { name: d, kind: range, min: 2.0, max: 5.0, step: 0.1, unit: cm, label: wall thickness }
parts:
  - id: conductivity
    prompt: "Find the thermal conductivity of the material of the box. {_0}{_u}"
    answer: P * (d / 100) / (A * dT)
    unit: W/(m K)
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { P: 155, dT: 55, A: 2.15, d: 3.1 }
  parts:
    - { id: conductivity, answer: 0.040634249471459, unit: W/(m K), source: P25 }
