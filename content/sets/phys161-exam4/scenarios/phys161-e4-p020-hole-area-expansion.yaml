# P20/P21 — a hole expands like the material around it: its diameter grows to d (1 + α ΔT) (P21),
# so its area is A = π (d/2)² (1 + α ΔT)² (P20). The diameter is given in cm; the answers are in m
# and m². The base canonical values are P20's; P21 overrides them (it prints α = 1.19×10⁻⁵).
id: phys161-e4-p020-hole-area-expansion
title: Size of a hole in a heated plate
source: { document: PHYS161_Exam4, labels: [ P20, P21 ] }
section: Temperature and heat
tags: [ thermal-expansion, linear-expansion, area-expansion, multi-part ]
narrative: >-
  A machinist bores a hole of diameter {d:unit} in a steel plate at a temperature of {T1:unit}.
  Linear coefficient of expansion for steel is $ {a5} \cdot 10^{-5}\ 1/°\text{C}$.
vars:
  - { name: d, kind: range, min: 0.8, max: 3.0, step: 0.1, unit: cm, label: hole diameter }
  - { name: T1, kind: range, min: 15, max: 25, step: 1, unit: °C, label: initial temperature }
  - { name: T2, kind: range, min: 100, max: 300, step: 1, unit: °C, label: final temperature }
  - { name: a5, kind: range, min: 1.10, max: 1.30, step: 0.01, label: α in 10⁻⁵ 1/°C }
derived:
  - { name: alpha, expr: "a5 * 1e-5", unit: 1/K }
parts:
  - id: diameter
    prompt: "What is the diameter of the hole when the temperature of the plate is increased to
      {T2:unit}? {_0}{_u}"
    answer: (d / 100) * (1 + alpha * (T2 - T1))
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 1
  - id: area
    prompt: >-
      What is the cross-sectional area of the hole when the temperature of the plate is increased to
      {T2:unit}? {_0}{_u}
    answer: pi * (d / 200)^2 * (1 + alpha * (T2 - T1))^2
    unit: m^2
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { d: 1.5, T1: 21, T2: 176, a5: 1.2 }
  parts:
    - { id: area, answer: 0.000177371965, unit: m^2, source: P20 }
    - {
        id: diameter,
        answer: 0.0140256564,
        unit: m,
        source: P21,
        vars: { d: 1.4, T1: 16, T2: 170, a5: 1.19 }
      }
