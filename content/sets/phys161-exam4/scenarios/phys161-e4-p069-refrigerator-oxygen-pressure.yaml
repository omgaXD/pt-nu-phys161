# P69 — kinetic theory: P V = (1/3) N m v_rms² = (1/3) n M v_rms², so P = n M v_rms² / (3V).
# The volume is in liters. R is stated by the source but not needed.
id: phys161-e4-p069-refrigerator-oxygen-pressure
title: Partial pressure of oxygen from its rms speed
source: { document: PHYS161_Exam4, labels: [ P69 ] }
section: Kinetic Theory of Gases
tags: [ kinetic-theory, rms-speed, pressure ]
narrative: >-
  There are {n} moles of oxygen in the refrigerator, and the molar mass of oxygen is 32 g/mol. The
  universal gas constant is $R = {R:unit}$.
vars:
  - { name: V, kind: range, min: 400, max: 800, step: 1, unit: L, label: refrigerator volume }
  - { name: v, kind: range, min: 400, max: 500, step: 1, unit: m/s, label: rms speed }
  - { name: n, kind: range, min: 3.00, max: 8.00, step: 0.01, unit: mol, label: amount of oxygen }
derived:
  - { name: R, expr: "8.31", unit: J/(mol K) }
parts:
  - id: partial-pressure
    prompt: >-
      If the root-mean-square speed of oxygen molecules inside a refrigerator of volume {V} L is
      {v:unit}, what is the partial pressure of the oxygen? {_0}{_u}
    answer: n * 0.032 * v^2 / (3 * V / 1000)
    unit: Pa
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
