# P19 — rods of length L expand by e_A and e_B for the same temperature rise, so per unit length
# they expand e_A / L and e_B / L. A rod of the same length with a piece L_A of metal A expands
# L_A e_A / L + (L − L_A) e_B / L = e₃, so L_A = L (e₃ − e_B) / (e_A − e_B). Lengths are in cm;
# the answer is in m. The printed e₃ is built from a hidden fraction of metal A (0.2–0.8, rounded
# to 0.001 cm as printed), so it always lies between e_B and e_A; the answer uses the printed e₃.
id: phys161-e4-p019-composite-rod
title: Composition of a two-metal rod from its expansion
source: { document: PHYS161_Exam4, labels: [ P19 ] }
section: Temperature and heat
tags: [ thermal-expansion, linear-expansion ]
figure:
  id: composite-rod
  src: figures/unnamed_003_xiMS.png
  alt: >-
    A horizontal rod made of two pieces joined end to end: a longer piece labelled A on the left and
    a shorter piece labelled B on the right. A double arrow above piece A marks its length L_A.
narrative: >-
  A metal rod A that is {L:unit} long expands by {eA:unit} when its temperature is raised from 0°C
  to 100°C. A rod B of a different metal and of the same length expands by {eB:unit} for the same
  rise in temperature. A third rod, also {L:unit} long, is made up of pieces of each of the above
  metals placed end to end and expands {e3:unit} between 0°C and 100°C. {@fig}
vars:
  - { name: L, kind: range, min: 30, max: 60, step: 1, unit: cm, label: rod length }
  - {
      name: eA,
      kind: range,
      min: 0.050,
      max: 0.090,
      step: 0.001,
      unit: cm,
      label: expansion of A
    }
  - {
      name: eB,
      kind: range,
      min: 0.015,
      max: 0.040,
      step: 0.001,
      unit: cm,
      label: expansion of B
    }
  # Hidden fraction of the rod made of metal A; the printed expansion of the third rod carries it.
  - { name: x, kind: range, min: 0.200, max: 0.800, step: 0.025, label: fraction of metal A }
derived:
  - { name: e3, expr: "round(eB + x * (eA - eB), 3)", unit: cm }
constraints:
  - "eA - eB >= 0.02" # the two metals expand clearly differently
parts:
  - id: length-a
    prompt: "Find $L_A$ the length of the portion of metal A in the third rod. {_0}{_u}"
    answer: (L / 100) * (e3 - eB) / (eA - eB)
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { L: 38, eA: 0.065, eB: 0.025, x: 0.625, e3: 0.05 }
  parts:
    - { id: length-a, answer: 0.2375, unit: m, source: P19 }
