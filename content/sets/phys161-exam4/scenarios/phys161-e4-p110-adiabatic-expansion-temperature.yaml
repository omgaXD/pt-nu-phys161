# P110/P111 — adiabatic: Q = 0, so the work comes from the internal energy, |ΔU| = W, or W / n per
# mole (P111). For a monatomic gas W = (3/2) n R |ΔT|, so |ΔT| = 2W / (3 n R) (P110). The base
# canonical values are P110's; P111 overrides them.
id: phys161-e4-p110-adiabatic-expansion-temperature
title: Adiabatic expansion of a monatomic gas
source: { document: PHYS161_Exam4, labels: [ P110, P111 ] }
section: 1st Law of Thermodynamics
tags: [ first-law, adiabatic, internal-energy, multi-part ]
narrative: >-
  {n} moles of an ideal monatomic gas expand adiabatically, performing {W:unit} of work in the
  process. The universal gas constant is $R = {R:unit}$.
vars:
  - { name: n, kind: range, min: 2.0, max: 12.0, step: 0.1, unit: mol, label: amount of gas }
  - { name: W, kind: range, min: 3000, max: 15000, step: 100, unit: J, label: work performed }
derived:
  - { name: R, expr: "8.31", unit: J/(mol K) }
parts:
  - id: energy-per-mole
    prompt: >-
      What is the magnitude of the change in internal energy per mole of the gas? {_0}{_u}
    answer: W / n
    unit: J/mol
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: temperature-change
    prompt: >-
      What is the magnitude of change in temperature of the gas during this expansion? {_0}{_u}
    answer: 2 * W / (3 * n * R)
    unit: K
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { n: 8.3, W: 9200, R: 8.31 }
  parts:
    - { id: temperature-change, answer: 88.923685113499, unit: K, source: P110 }
    - {
        id: energy-per-mole,
        answer: 1810.3448275862,
        unit: J/mol,
        source: P111,
        vars: { n: 5.8, W: 10500 }
      }
