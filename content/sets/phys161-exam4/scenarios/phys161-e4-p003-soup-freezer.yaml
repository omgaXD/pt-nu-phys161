# P3 — the bowl and soup give up Q: first cooling to 0 °C, (m_b c_Al + m_s c_w) T₀, then freezing
# the soup, m_s L_f, and the rest cools the bowl and the ice below 0 °C:
# T_f = −(Q − (m_b c_Al + m_s c_w) T₀ − m_s L_f) / (m_b c_Al + m_s c_ice), in °C; the answer is
# in K with the source's 273 offset (exactUnit). The printed Q (whole kJ) is built from a hidden
# final temperature 3–25 °C below zero, so the soup always freezes completely; the answer uses the
# printed Q.
id: phys161-e4-p003-soup-freezer
title: Final temperature of soup in a freezer
source: { document: PHYS161_Exam4, labels: [ P3 ] }
section: Temperature and heat
tags: [ heat, calorimetry, phase-change, latent-heat ]
narrative: >-
  Specific heat of ice is {ci:unit}. Specific heat of water is {cw:unit}. Specific heat of aluminum
  is {cal:unit}. Latent heat of fusion for water is {Lf:unit}.
vars:
  - { name: mb, kind: range, min: 0.10, max: 0.40, step: 0.05, unit: kg, label: bowl mass }
  - { name: ms, kind: range, min: 0.50, max: 1.20, step: 0.05, unit: kg, label: soup mass }
  - { name: T0, kind: range, min: 15, max: 30, step: 1, unit: °C, label: initial temperature }
  # Hidden: how far below 0 °C the system ends; the printed Q carries it.
  - { name: sub, kind: range, min: 3, max: 25, step: 1, unit: °C, label: degrees below zero }
derived:
  - { name: ci, expr: "2090", unit: J/(kg K) }
  - { name: cw, expr: "4186", unit: J/(kg K) }
  - { name: cal, expr: "900", unit: J/(kg K) }
  - { name: Lf, expr: "334", unit: kJ/kg }
  - { name: Qfrozen, expr: "(mb * cal + ms * cw) * T0 + ms * Lf * 1000", unit: J }
  - { name: Q, expr: "round((Qfrozen + (mb * cal + ms * ci) * sub) / 1000)", unit: kJ }
  - { name: Tf, expr: "-(Q * 1000 - Qfrozen) / (mb * cal + ms * ci)", unit: °C }
parts:
  - id: final-temperature
    prompt: >-
      A {mb:unit} aluminum bowl holding {ms:unit} of soup at {T0:unit} is placed in a freezer. What
      is the final temperature, if {Q:unit} of energy is transferred from the bowl and soup,
      assuming the soup's thermal properties are the same as that of water? Answer in Kelvin (K).
      {_0}{_u}
    answer: 273 + Tf
    unit: K
    exactUnit: true
    tolerance: { rel: 0.01 }
    difficulty: 4
canonical:
  vars: { mb: 0.2, ms: 0.8, T0: 21, sub: 10, Q: 360, ci: 2090, cw: 4186, cal: 900, Lf: 334 }
  parts:
    - { id: final-temperature, answer: 262.90539956803, unit: K, source: P3 }
