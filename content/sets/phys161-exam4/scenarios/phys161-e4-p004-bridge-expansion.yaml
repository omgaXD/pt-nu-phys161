# P4 — linear thermal expansion: ΔL = α L (T_hot − T_cold). α is printed as a multiple of 10⁻⁶.
id: phys161-e4-p004-bridge-expansion
title: Thermal expansion of a steel bridge
source: { document: PHYS161_Exam4, labels: [ P4 ] }
section: Temperature and heat
tags: [ thermal-expansion, linear-expansion ]
narrative: >-
  Assume that a bridge is built from steel as a single, continuous structure, {L:unit} long. Taking
  the coefficient of thermal expansion of steel equal to $ {a6} \times 10^{-6}\ 1/\text{K}$.
vars:
  - { name: L, kind: range, min: 80, max: 250, step: 1, unit: m, label: bridge length }
  - { name: a6, kind: range, min: 10.0, max: 13.0, step: 0.1, decimals: 1, label: α in 10⁻⁶ 1/K }
  - { name: Tc, kind: range, min: -35, max: -10, step: 1, unit: °C, label: coldest temperature }
  - { name: Th, kind: range, min: 25, max: 42, step: 1, unit: °C, label: hottest temperature }
parts:
  - id: length-change
    prompt: >-
      Calculate by how much the length of the bridge changes between the coldest winter day
      ({Tc:unit}) and the hottest summer day (+{Th:unit})? {_0}{_u}
    answer: a6 * 1e-6 * L * (Th - Tc)
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 1
canonical:
  vars: { L: 143, a6: 10.5, Tc: -26, Th: 35 }
  parts:
    - { id: length-change, answer: 0.0915915, unit: m, source: P4 }
