# P42/P44 — in a mixture both gases share one temperature, and v_rms = sqrt(3 R T / M). So
# v_He = v_O₂ sqrt(M_O₂ / M_He) (P42) and T = M_O₂ v_O₂² / (3R) (P44). The base canonical values
# are P42's; P44 overrides them.
id: phys161-e4-p042-helium-oxygen-mixture
title: Helium–oxygen mixture
source: { document: PHYS161_Exam4, labels: [ P42, P44 ] }
section: Kinetic Theory of Gases
tags: [ kinetic-theory, rms-speed, temperature, multi-part ]
narrative: >-
  Consider a gas mixture of Helium and Oxygen molecules assuming $O_2$ is diatomic. The
  root-mean-square velocity for the $O_2$ molecules is {v:unit}. Molar mass of helium is 4 g/mol,
  molar mass of oxygen is 32 g/mol.
vars:
  - { name: v, kind: range, min: 380, max: 520, step: 1, unit: m/s, label: rms speed of O₂ }
derived:
  - { name: R, expr: "8.31", unit: J/(mol K) }
parts:
  - id: helium-rms
    prompt: "Find $v_{rms}$ for the Helium atoms. {_0}{_u}"
    answer: v * sqrt(32 / 4)
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: temperature
    prompt: >-
      The universal gas constant is $R = {R:unit}$. Find the temperature of the gas in Kelvin.
      {_0}{_u}
    answer: 0.032 * v^2 / (3 * R)
    unit: K
    exactUnit: true
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { v: 435, R: 8.31 }
  parts:
    - { id: helium-rms, answer: 1230.365799, unit: m/s, source: P42 }
    - { id: temperature, answer: 301.93341355796, unit: K, source: P44, vars: { v: 485 } }
