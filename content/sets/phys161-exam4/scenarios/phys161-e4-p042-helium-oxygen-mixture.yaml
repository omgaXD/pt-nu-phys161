# P42/P43/P44 — in a mixture both gases share one temperature, and v_rms = sqrt(3 R T / M). So the
# helium atoms are faster by sqrt(M_O₂ / M_He) (P43), v_He = v_O₂ sqrt(M_O₂ / M_He) (P42) and
# T = M_O₂ v_O₂² / (3R) (P44). The base canonical values are P42's; P43 and P44 override them (P43
# prints M_O₂ = 31.95 g/mol).
id: phys161-e4-p042-helium-oxygen-mixture
title: Helium–oxygen mixture
source: { document: PHYS161_Exam4, labels: [ P42, P43, P44 ] }
section: Kinetic Theory of Gases
tags: [ kinetic-theory, rms-speed, temperature, multi-part ]
narrative: >-
  Consider a gas mixture of Helium and Oxygen molecules in thermal equilibrium, assuming $O_2$ is
  diatomic. The root-mean-square velocity for the $O_2$ molecules is {v:unit}. Molar mass of helium
  is 4 g/mol, molar mass of oxygen is {MO:unit}.
vars:
  - { name: v, kind: range, min: 380, max: 520, step: 1, unit: m/s, label: rms speed of O₂ }
  - { name: MO, kind: choice, options: [ 31.95, 32 ], unit: g/mol, label: molar mass of O₂ }
derived:
  - { name: R, expr: "8.31", unit: J/(mol K) }
parts:
  - id: speed-ratio
    prompt: >-
      By what factor is the root-mean-square speed of the helium atoms larger than that of the
      oxygen molecules? {_0}
    answer: sqrt(MO / 4)
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: helium-rms
    prompt: "Find $v_{rms}$ for the Helium atoms. {_0}{_u}"
    answer: v * sqrt(MO / 4)
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: temperature
    prompt: >-
      The universal gas constant is $R = {R:unit}$. Find the temperature of the gas in Kelvin.
      {_0}{_u}
    answer: MO / 1000 * v^2 / (3 * R)
    unit: K
    exactUnit: true
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { v: 435, MO: 32, R: 8.31 }
  parts:
    - { id: helium-rms, answer: 1230.365799, unit: m/s, source: P42 }
    - { id: speed-ratio, answer: 2.8262165526, source: P43, vars: { MO: 31.95 } }
    - { id: temperature, answer: 301.93341355796, unit: K, source: P44, vars: { v: 485 } }
