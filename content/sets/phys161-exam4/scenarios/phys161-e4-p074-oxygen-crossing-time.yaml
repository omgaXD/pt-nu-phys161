# P74 — the molecule moves at v_rms = sqrt(3 R T / M) on average, so covering N crossings of a room
# of length L takes t = N L / v_rms. The temperature uses the source's 273 offset.
id: phys161-e4-p074-oxygen-crossing-time
title: Time for an oxygen molecule to cross a room
source: { document: PHYS161_Exam4, labels: [ P74 ] }
section: Kinetic Theory of Gases
tags: [ kinetic-theory, rms-speed ]
narrative: >-
  Molar mass of oxygen is 32 g/mol. The universal gas constant is $R = {R:unit}$.
vars:
  - { name: T, kind: range, min: 0, max: 30, step: 1, unit: °C, label: temperature }
  - { name: L, kind: range, min: 4, max: 10, step: 0.5, label: room length in m }
  - { name: N, kind: range, min: 20, max: 60, step: 5, label: number of crossings }
derived:
  - { name: R, expr: "8.31", unit: J/(mol K) }
  - { name: d, expr: "N * L", unit: m }
parts:
  - id: time
    prompt: >-
      Calculate how much time in average it would take an oxygen molecule at {T:unit} to move back
      and forth across a {L}-m-long room {N} times, passing in total {d:unit} distance. {_0}{_u}
    answer: d / sqrt(3 * R * (T + 273) / 0.032)
    unit: s
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { T: 12, L: 6, N: 40, R: 8.31 }
  parts:
    - { id: time, answer: 0.50933399254989, unit: s, source: P74 }
