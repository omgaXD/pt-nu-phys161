# P81/P82/P83 — the lead cools from T_i to the lake's T_L, giving the lake Q = m c (T_i − T_L).
# The lake stays at T_L: ΔS_lake = Q / T_L (P81). The lead: ΔS_lead = m c ln(T_L / T_i) (P82).
# The universe: their sum (P83). Temperatures use the source's 273 offset. The base canonical
# values are P81's (P83 shares them); P82 overrides the mass.
id: phys161-e4-p081-hot-lead-in-lake
title: Entropy changes when hot lead cools in a lake
source: { document: PHYS161_Exam4, labels: [ P81, P82, P83 ] }
section: 2nd Law of Thermodynamics
tags: [ second-law, entropy, specific-heat, multi-part ]
narrative: >-
  A {m} kg piece of lead at a temperature of {Ti:unit} is placed in a lake whose temperature is
  {TL:unit}. Specific heat of the lead is $c_{lead}$ = {c:unit}.
vars:
  - { name: m, kind: range, min: 2, max: 10, step: 1, unit: kg, label: lead mass }
  - { name: Ti, kind: range, min: 200, max: 400, step: 5, unit: °C, label: lead temperature }
  - { name: TL, kind: range, min: 5, max: 25, step: 1, unit: °C, label: lake temperature }
derived:
  - { name: c, expr: "128", unit: J/(kg K) }
  - { name: Slake, expr: "m * c * (Ti - TL) / (TL + 273)", unit: J/K }
  - { name: Slead, expr: "m * c * ln((TL + 273) / (Ti + 273))", unit: J/K }
parts:
  - id: lake-entropy
    prompt: "Determine the entropy change of the lake. {_0}{_u}"
    answer: Slake
    unit: J/K
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: lead-entropy
    prompt: "Determine the entropy change of the lead piece. {_0}{_u}"
    answer: Slead
    unit: J/K
    tolerance: { rel: 0.01 }
    difficulty: 3
  - id: universe-entropy
    prompt: "Determine the entropy change of the universe due to this process. {_0}{_u}"
    answer: Slake + Slead
    unit: J/K
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { m: 8, Ti: 320, TL: 14, c: 128 }
  parts:
    - { id: lake-entropy, answer: 1091.79, unit: J/K, source: P81 }
    - { id: lead-entropy, answer: -371.56, unit: J/K, source: P82, vars: { m: 4 } }
    - { id: universe-entropy, answer: 348.4, unit: J/K, source: P83 }
