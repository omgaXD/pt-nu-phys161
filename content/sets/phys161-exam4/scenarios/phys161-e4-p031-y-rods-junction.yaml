# P31 — steady state: the heat current into the junction through the copper rod equals the
# currents out through the brass and steel rods (same area, which cancels):
# k_c (100 − T) / L_c = k_b T / L_b + k_s T / L_s, so T = 100 (k_c / L_c) / (k_c/L_c + k_b/L_b + k_s/L_s)
# in °C, and the answer is in K with the source's 273 offset (exactUnit). The end temperatures
# (100 °C and 0 °C) are drawn in the figure and stay fixed.
id: phys161-e4-p031-y-rods-junction
title: Junction temperature of three welded rods
source: { document: PHYS161_Exam4, labels: [ P31 ] }
section: Temperature and heat
tags: [ heat-conduction, thermal-conductivity, steady-state ]
figure:
  id: y-rods
  src: figures/unnamed_007_p-J8.png
  alt: >-
    A Y-shaped joint of three rods. The vertical copper rod runs down from a free end at 100 °C to
    the junction at temperature T °C; from the junction a steel rod runs down to the left and a
    brass rod down to the right, each ending at 0 °C. Arrows along the rods point away from the 100
    °C end, showing the direction of heat flow.
narrative: >-
  Rods of copper, brass, and steel are welded together to form a Y-shaped figure. The
  cross-sectional area of each rod is {A:unit}. The free end of the copper rod is maintained at
  100°C, and the free ends of the brass and steel rods at 0°C. Assume there is no heat loss from the
  surfaces of the rods. The lengths of the rods are: copper, {Lc:unit}; brass, {Lb:unit}; steel,
  {Ls:unit}. {@fig}
vars:
  - {
      name: A,
      kind: range,
      min: 1.0,
      max: 3.0,
      step: 0.1,
      unit: cm^2,
      label: cross-sectional area
    }
  - { name: Lc, kind: range, min: 8, max: 20, step: 1, unit: cm, label: copper length }
  - { name: Lb, kind: range, min: 15, max: 30, step: 1, unit: cm, label: brass length }
  - { name: Ls, kind: range, min: 15, max: 30, step: 1, unit: cm, label: steel length }
derived:
  - { name: kc, expr: "390", unit: W/(m °C) }
  - { name: ks, expr: "50", unit: W/(m °C) }
  - { name: kb, expr: "130", unit: W/(m °C) }
parts:
  - id: junction-temperature
    prompt: >-
      What is the temperature of the junction point? Answer in Kelvins (K). Thermal conductivity of
      the copper is {kc:unit}. Thermal conductivity of the steel is {ks:unit}. Thermal conductivity
      of the brass is {kb:unit}. {_0}{_u}
    answer: 273 + 100 * (kc / Lc) / (kc / Lc + kb / Lb + ks / Ls)
    unit: K
    exactUnit: true
    tolerance: { rel: 0.01 }
    difficulty: 4
canonical:
  vars: { A: 1.8, Lc: 11, Lb: 21, Ls: 23, kc: 390, ks: 50, kb: 130 }
  parts:
    - { id: junction-temperature, answer: 353.9114729, unit: K, source: P31 }
