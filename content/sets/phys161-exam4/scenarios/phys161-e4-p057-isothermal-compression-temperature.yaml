# P57 — isothermal compression to one-fifth of the volume takes work W = n R T ln(V₁ / V₂)
# = n R T ln 5, so T = W / (n R ln 5). The fraction stays one-fifth, as worded.
id: phys161-e4-p057-isothermal-compression-temperature
title: Temperature of an isothermal compression
source: { document: PHYS161_Exam4, labels: [ P57 ] }
section: 1st Law of Thermodynamics
tags: [ first-law, isothermal, work ]
narrative: >-
  The universal gas constant is $R = {R:unit}$.
vars:
  - { name: W, kind: range, min: 200, max: 800, step: 10, unit: J, label: work }
  - { name: n, kind: range, min: 0.3, max: 2.0, step: 0.1, unit: mol, label: amount of gas }
derived:
  - { name: R, expr: "8.31", unit: J/(mol K) }
parts:
  - id: temperature
    prompt: >-
      It takes {W:unit} of work to compress quasi-statically {n} moles of an ideal gas to one-fifth
      its volume. Calculate the temperature of the gas, assuming it remains constant during the
      compression. {_0}{_u}
    answer: W / (n * R * ln(5))
    unit: K
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { W: 400, n: 0.8, R: 8.31 }
  parts:
    - { id: temperature, answer: 37.384773439206, unit: K, source: P57 }
