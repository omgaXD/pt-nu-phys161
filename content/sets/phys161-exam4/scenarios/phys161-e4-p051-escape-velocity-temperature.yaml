# P51 — v_rms = sqrt(3 R T / M) equals the escape velocity when T = M v² / (3R). The speed is
# given in km/s and the molar mass in g/mol.
id: phys161-e4-p051-escape-velocity-temperature
title: Temperature for hydrogen to reach escape velocity
source: { document: PHYS161_Exam4, labels: [ P51 ] }
section: Kinetic Theory of Gases
tags: [ kinetic-theory, rms-speed, temperature, escape-velocity ]
narrative: >-
  The universal gas constant is $R = {R:unit}$.
vars:
  - { name: v, kind: range, min: 1.5, max: 4.0, step: 0.1, unit: km/s, label: escape velocity }
derived:
  - { name: R, expr: "8.31", unit: J/(mol K) }
parts:
  - id: temperature
    prompt: >-
      The escape velocity from Planet X is {v:unit}. At what temperature would hydrogen molecules
      (molar mass is equal to 2.016 g/mol) have a root-mean-square velocity equal to the Planet X's
      escape velocity? {_0}{_u}
    answer: 0.002016 * (v * 1000)^2 / (3 * R)
    unit: K
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { v: 2.6, R: 8.31 }
  parts:
    - { id: temperature, answer: 546.65703971119, unit: K, source: P51 }
