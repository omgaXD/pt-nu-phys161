# P14 — all the potential energy heats the ball: m g h = m c ΔT, so h = c ΔT / g (the mass
# cancels).
id: phys161-e4-p014-lead-ball-drop-height
title: Drop height to warm a lead ball
source: { document: PHYS161_Exam4, labels: [ P14 ] }
section: Temperature and heat
tags: [ heat, energy-conservation, specific-heat ]
narrative: >-
  A lead ball falls from rest and lands on the floor without bouncing, so that all of the energy of
  the fall goes into heating the ball. The specific heat of lead is {c:unit} and the gravitational
  acceleration is $g = {g:unit}$.
