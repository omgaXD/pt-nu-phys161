# P15 — area expansion of the cube's six faces: ΔA = 2α · 6a² · ΔT (the linear approximation the
# source uses). The edge is given in cm; the answer is in m².
id: phys161-e4-p015-cube-surface-expansion
title: Surface area increase of a heated brass cube
source: { document: PHYS161_Exam4, labels: [ P15 ] }
section: Temperature and heat
tags: [ thermal-expansion, area-expansion ]
narrative: >-
  Assume that the coefficient of linear expansion for brass is $19 \times 10^{-6}\ 1/\text{K}$.
vars:
  - { name: a, kind: range, min: 20, max: 60, step: 1, unit: cm, label: edge length }
  - { name: T1, kind: range, min: 20, max: 50, step: 0.5, unit: °C, label: initial temperature }
  - { name: dT, kind: range, min: 5, max: 30, step: 0.5, unit: °C, label: temperature rise }
derived:
  - { name: alpha, expr: "19e-6", unit: 1/K }
  - { name: T2, expr: "T1 + dT", unit: °C }
parts:
  - id: area-increase
    prompt: >-
      A cube made of brass, with an edge length of {a:unit}, is heated from {T1:unit} to {T2:unit}.
      Calculate the increase of the cube's surface area. {_0}{_u}
    answer: 2 * alpha * 6 * (a / 100)^2 * dT
    unit: m^2
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { a: 44, T1: 44.5, dT: 12, alpha: 1.9e-5 }
  parts:
    - { id: area-increase, answer: 0.0005296896, unit: m^2, source: P15 }
