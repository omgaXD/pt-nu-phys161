# P48 — v_rms ∝ sqrt(T), so raising v_rms by p% needs T₂ = T₁ (1 + p/100)². The answer is in K
# (exactUnit) with the 273.15 offset, which this problem's printed answer uses.
id: phys161-e4-p048-rms-speed-increase
title: Temperature for a higher rms speed
source: { document: PHYS161_Exam4, labels: [ P48 ] }
section: Kinetic Theory of Gases
tags: [ kinetic-theory, rms-speed, temperature ]
narrative: ""
vars:
  - { name: T1, kind: range, min: 10, max: 30, step: 1, unit: °C, label: initial temperature }
  - { name: p, kind: range, min: 2, max: 10, step: 1, unit: "%", label: speed increase }
parts:
  - id: temperature
    prompt: >-
      The root-mean-square speed of molecules in a gas at {T1:unit} is to be increased by {p}%. To
      what temperature must it be raised? Answer in kelvins (K). {_0}{_u}
    answer: (T1 + 273.15) * (1 + p / 100)^2
    unit: K
    exactUnit: true
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { T1: 20, p: 3 }
  parts:
    - { id: temperature, answer: 311, unit: K, source: P48 }
