# P62/P63 — helium heated at constant temperature T₁ until the pressure falls to P₂: Boyle's law
# gives V₂ = V₁ P₁ / P₂ (P62). Compressing it at constant pressure P₂ back to V₁ cools it to
# T₃ = T₁ V₁ / V₂ = T₁ P₂ / P₁ (P63). Volumes are in L; P₁ is printed in units of 10⁵ Pa and P₂ in
# 10⁴ Pa, as in the source. The base canonical values are P62's; P63 overrides them.
id: phys161-e4-p062-helium-isothermal-isobaric
title: Helium in a cylinder with a movable piston
source: { document: PHYS161_Exam4, labels: [ P62, P63 ] }
section: 1st Law of Thermodynamics
tags: [ first-law, isothermal, isobaric, ideal-gas, multi-part ]
narrative: >-
  A cylinder with a frictionless, movable piston contains a quantity of helium gas. Initially the
  gas is at a pressure of $ {p15}\times10^{5}$ Pa, has a temperature of {T1:unit}, and occupies a
  volume of {V1:unit}. 1 L = 0.001 m^3
vars:
  - { name: p15, kind: range, min: 0.80, max: 1.00, step: 0.01, label: P₁ in 10⁵ Pa }
  - { name: p24, kind: range, min: 1.50, max: 3.00, step: 0.01, label: P₂ in 10⁴ Pa }
  - { name: T1, kind: range, min: 280, max: 310, step: 1, unit: K, label: temperature }
  - { name: V1, kind: range, min: 1.00, max: 2.00, step: 0.01, unit: L, label: initial volume }
derived:
  - { name: P1, expr: "p15 * 1e5", unit: Pa }
  - { name: P2, expr: "p24 * 1e4", unit: Pa }
parts:
  - id: final-volume
    prompt: >-
      The gas then is heated and the piston is allowed to move to keep the temperature equal to
      {T1:unit}. This continues until the pressure reaches $ {p24}\times10^{4}$ Pa. Assume that the
      gas may be treated as ideal. Find the volume of the gas at the end of the process. {_0}{_u}
    answer: V1 / 1000 * P1 / P2
    unit: m^3
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: final-temperature
    prompt: >-
      The gas then undergoes two processes. In the first, the gas is heated and the piston is
      allowed to move to keep the temperature equal to {T1:unit}. This continues until the pressure
      reaches $ {p24}\times10^{4}$ Pa. In the second process, the gas is compressed at constant
      pressure until it returns to its original volume {V1:unit}. Assume that the gas may be treated
      as ideal. Find the temperature at the end of the second process. {_0}{_u}
    answer: T1 * P2 / P1
    unit: K
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { p15: 0.94, p24: 2.36, T1: 299, V1: 1.46 }
  parts:
    - { id: final-volume, answer: 0.0058152542372881, unit: m^3, source: P62 }
    - {
        id: final-temperature,
        answer: 67.845652173913,
        unit: K,
        source: P63,
        vars: { p15: 0.92, p24: 2.06, T1: 303, V1: 1.23 }
      }
