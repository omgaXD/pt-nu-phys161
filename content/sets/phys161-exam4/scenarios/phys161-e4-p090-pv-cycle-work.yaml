# P90/P92 — the work of a cycle is the area it encloses on the pV diagram (positive when traversed
# clockwise). ADBA is the triangle A(V₁, p₁), D(V₁, p₂), B(V₂, p₁): W = ½ (p₂ − p₁)(V₂ − V₁) (P90).
# ADCBA is the whole rectangle: W = (p₂ − p₁)(V₂ − V₁) (P92). Pressures are in atm and volumes in
# L. The two problems print the same figure. The base canonical values are P90's; P92 overrides
# them.
id: phys161-e4-p090-pv-cycle-work
title: Work around cycles on a pV diagram
source: { document: PHYS161_Exam4, labels: [ P90, P92 ] }
section: 1st Law of Thermodynamics
tags: [ first-law, work, pv-diagram, cycle, multi-part ]
figure:
  id: pv-rectangle
  src: figures/unnamed_003_p-J8.png
  alt: >-
    A pV diagram, p in atm against V in L, with a rectangle of corners A (V₁, p₁) bottom left, D
    (V₁, p₂) top left, C (V₂, p₂) top right and B (V₂, p₁) bottom right, plus the diagonals AC and
    DB. Arrows run up from A to D, right from D to C, down from C to B and left from B to A; the
    diagonals carry arrows from A toward C and from D toward B.
narrative: >-
  PV diagram is shown below. $p_1$ = {p1} atm, $p_2$ = {p2} atm, $V_1$ = {V1} L, $V_2$ = {V2} L. 1
  atm = 101325 Pa 1 L = 0.001 m^3 {@fig}
vars:
  - { name: p1, kind: range, min: 1, max: 3, step: 1, unit: atm, label: lower pressure }
  - { name: dp, kind: range, min: 2, max: 6, step: 1, unit: atm, label: pressure difference }
  - { name: V1, kind: range, min: 1, max: 3, step: 1, unit: L, label: smaller volume }
  - { name: dV, kind: range, min: 2, max: 6, step: 1, unit: L, label: volume difference }
derived:
  - { name: p2, expr: "p1 + dp", unit: atm }
  - { name: V2, expr: "V1 + dV", unit: L }
parts:
  - id: triangle-work
    prompt: >-
      Calculate the work done by the gas in the quasi-static processes represented by the ADBA path
      cycle. {_0}{_u}
    answer: 0.5 * (p2 - p1) * 101325 * (V2 - V1) / 1000
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 3
  - id: rectangle-work
    prompt: >-
      Calculate the work done by the gas in the quasi-static processes represented by the ADCBA
      cycle path. {_0}{_u}
    answer: (p2 - p1) * 101325 * (V2 - V1) / 1000
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { p1: 2, dp: 4, V1: 2, dV: 4 }
  parts:
    - { id: triangle-work, answer: 810.6, unit: J, source: P90 }
    - { id: rectangle-work, answer: 1621.2, unit: J, source: P92, vars: { p1: 1, V1: 1 } }
