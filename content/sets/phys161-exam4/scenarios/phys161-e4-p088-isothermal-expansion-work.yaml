# P88/P89 — isothermal expansion: P V is constant, so P₂ = P₁ V₁ / V₂ (P89), and the work is
# W = n R T ln(V₂ / V₁) = P₁ V₁ ln(V₂ / V₁) (P88); the amount of gas is part of the data but not
# needed. Volumes are in liters. The base canonical values are P88's; P89 overrides them.
id: phys161-e4-p088-isothermal-expansion-work
title: Isothermal expansion of an ideal gas
source: { document: PHYS161_Exam4, labels: [ P88, P89 ] }
section: 1st Law of Thermodynamics
tags: [ first-law, isothermal, work, multi-part ]
narrative: >-
  {n} moles of an ideal gas, at an initial pressure of $ {p5}\times10^{5}$ N/m^2 and an initial
  volume of {V1} L, undergo an isothermal expansion to a volume of {V2} L. The universal gas
  constant is $R = {R:unit}$. 1 L = 0.001 m^3.
vars:
  - { name: n, kind: range, min: 0.10, max: 0.50, step: 0.01, unit: mol, label: amount of gas }
  - { name: p5, kind: range, min: 1.0, max: 5.0, step: 0.1, label: initial pressure in 10⁵ N/m² }
  - { name: V1, kind: range, min: 1.0, max: 2.0, step: 0.1, unit: L, label: initial volume }
  - { name: V2, kind: range, min: 2.5, max: 5.0, step: 0.1, unit: L, label: final volume }
derived:
  - { name: R, expr: "8.31", unit: J/(mol K) }
  - { name: P1, expr: "p5 * 1e5", unit: N/m^2 }
parts:
  - id: final-pressure
    prompt: "Find the final pressure of the gas. {_0}{_u}"
    answer: P1 * V1 / V2
    unit: Pa
    tolerance: { rel: 0.01 }
    difficulty: 1
  - id: work
    prompt: "Find the work done by the gas. {_0}{_u}"
    answer: P1 * V1 / 1000 * ln(V2 / V1)
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { n: 0.2, p5: 3, V1: 1.4, V2: 3.5, R: 8.31 }
  parts:
    - { id: work, answer: 384.83, unit: J, source: P88 }
    - {
        id: final-pressure,
        answer: 173437.5,
        unit: Pa,
        source: P89,
        vars: { n: 0.28, p5: 3.7, V1: 1.5, V2: 3.2 }
      }
