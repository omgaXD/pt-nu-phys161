# P45 — N = n N_A = P V N_A / (R T) in V = 1 cm³ = 10⁻⁶ m³. The temperature uses the 273.15 offset,
# which this problem's printed answer uses. The count is printed unrounded ("without units").
id: phys161-e4-p045-vacuum-molecule-count
title: Molecules per cubic centimetre in a vacuum
source: { document: PHYS161_Exam4, labels: [ P45 ] }
section: Kinetic Theory of Gases
tags: [ ideal-gas, number-of-molecules ]
narrative: >-
  Avogadro's number $N_A = {NA:unit}$. The universal gas constant is $R = {R:unit}$.
vars:
  - {
      name: P,
      kind: range,
      min: 1e-7,
      max: 9.9e-7,
      step: 1e-8,
      sigfigs: 2,
      unit: N/m^2,
      label: pressure
    }
  - { name: T, kind: range, min: 15, max: 35, step: 1, unit: °C, label: temperature }
derived:
  - { name: NA, expr: "6.022e23", unit: 1/mol }
  - { name: R, expr: "8.31", unit: J/(mol K) }
parts:
  - id: molecules
    prompt: >-
      A vacuum system can achieve a pressure of {P:unit} at {T:unit}. How many molecules are there
      in a cubic centimeter at given pressure and temperature? Answer without units. {_0}
    answer: P * 1e-6 * NA / (R * (T + 273.15))
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { P: 1.9e-7, T: 25, NA: 6.022e+23, R: 8.31 }
  parts:
    - { id: molecules, answer: 46180487, source: P45 }
