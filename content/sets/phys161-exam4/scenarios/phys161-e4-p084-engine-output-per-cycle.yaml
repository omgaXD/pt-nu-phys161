# P84/P85 — at f cycles per second an output power P is W = P / f per cycle (P85). With efficiency
# e the engine takes in Q_h = W / e and rejects Q_c = Q_h − W = W (1/e − 1) per cycle (P84). The
# base canonical values are P84's; P85 overrides them.
id: phys161-e4-p084-engine-output-per-cycle
title: Work and rejected heat per cycle of an engine
source: { document: PHYS161_Exam4, labels: [ P84, P85 ] }
section: 2nd Law of Thermodynamics
tags: [ second-law, heat-engine, efficiency, power, multi-part ]
narrative: >-
  An output of an engine with efficiency of {eff}% is {P:unit}. It works at {f} cycles/s.
vars:
  - { name: eff, kind: range, min: 10, max: 40, step: 1, unit: "%", label: efficiency }
  - { name: P, kind: range, min: 150, max: 400, step: 1, unit: W, label: output power }
  - { name: f, kind: range, min: 5, max: 20, step: 1, label: cycles per second }
parts:
  - id: rejected-heat
    prompt: "How much heat is rejected each cycle? {_0}{_u}"
    answer: (P / f) * (100 / eff - 1)
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 3
  - id: work-per-cycle
    prompt: "How much work is done in each cycle? {_0}{_u}"
    answer: P / f
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 1
canonical:
  vars: { eff: 20, P: 215, f: 8 }
  parts:
    - { id: rejected-heat, answer: 107.5, unit: J, source: P84 }
    - {
        id: work-per-cycle,
        answer: 18.692307692308,
        unit: J,
        source: P85,
        vars: { eff: 15, P: 243, f: 13 }
      }
