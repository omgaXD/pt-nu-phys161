  - { name: H, kind: range, min: 24, max: 32, step: 1, unit: MJ/kg, label: heat of combustion }
parts:
  - id: coal-per-hour
    prompt: >-
      A coal power plant produces {P:unit} of electrical power at an efficiency of {eff}. If the
      heat of combustion of coal is {H:unit}, how many kilograms of coal does it consume per hour?
      {_0}{_u}
    answer: P / eff * 3600 / H
    unit: kg
    tolerance: { rel: 0.01 }
    difficulty: 2
