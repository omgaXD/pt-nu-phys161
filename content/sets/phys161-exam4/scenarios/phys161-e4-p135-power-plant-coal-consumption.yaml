# P135 — the plant burns heat at the rate P / e, so in an hour (3600 s) it uses m = (P / e) · 3600 / H
# of coal, H being the heat of combustion.
id: phys161-e4-p135-power-plant-coal-consumption
title: Coal burned by a power plant per hour
source: { document: PHYS161_Exam4, labels: [ P135 ] }
section: 2nd Law of Thermodynamics
tags: [ second-law, heat-engine, efficiency, power ]
narrative: ""
vars:
