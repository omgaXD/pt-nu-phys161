# P28 — the ice warms from T_i to 0 °C, melts and warms to T_f; the water cools from T_w to T_f:
# m_ice (c_ice (−T_i) + L_f + c_w T_f) = m_w c_w (T_w − T_f).
id: phys161-e4-p028-ice-into-hot-water
title: Ice needed for a final temperature
source: { document: PHYS161_Exam4, labels: [ P28 ] }
section: Temperature and heat
tags: [ heat, calorimetry, phase-change, latent-heat ]
narrative: >-
  An insulated beaker with negligible mass contains {mw:unit} of water at a temperature of
  {Tw:unit}. Specific heat of water is {cw:unit}. Specific heat of ice is {ci:unit}. Latent heat of
  fusion for water is {Lf:unit}.
vars:
  - { name: mw, kind: range, min: 0.150, max: 0.350, step: 0.005, unit: kg, label: water mass }
  - { name: Tw, kind: range, min: 70, max: 95, step: 1, unit: °C, label: water temperature }
  - { name: Ti, kind: range, min: -20, max: -5, step: 1, unit: °C, label: ice temperature }
  - { name: Tf, kind: range, min: 10, max: 45, step: 1, unit: °C, label: final temperature }
derived:
  - { name: cw, expr: "4186", unit: J/(kg K) }
  - { name: ci, expr: "2100", unit: J/(kg K) }
  - { name: Lf, expr: "334", unit: kJ/kg }
constraints:
  - "Tw - Tf >= 25" # the water clearly cools
parts:
  - id: ice-mass
    prompt: >-
      How many kilograms of ice at a temperature of {Ti:unit} must be dropped into the water to make
      the final temperature of the system {Tf:unit}? {_0}{_u}
    answer: mw * cw * (Tw - Tf) / (-ci * Ti + Lf * 1000 + cw * Tf)
    unit: kg
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { mw: 0.225, Tw: 91, Ti: -14, Tf: 33, cw: 4186, ci: 2100, Lf: 334 }
  parts:
    - { id: ice-mass, answer: 0.10891956342291, unit: kg, source: P28 }
