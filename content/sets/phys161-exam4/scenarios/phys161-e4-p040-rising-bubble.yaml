# P40 — the bubble's gas obeys P V / T = const. At depth h the pressure is P₀ + ρ g h, so at the
# surface V₂ = V₁ (P₀ + ρ g h) / P₀ · T₂ / T₁, and the radius is r = (3 V₂ / 4π)^(1/3). The volume
# is given in cm³; the temperatures use the source's 273 offset.
id: phys161-e4-p040-rising-bubble
title: Radius of a rising air bubble
source: { document: PHYS161_Exam4, labels: [ P40 ] }
section: Kinetic Theory of Gases
tags: [ ideal-gas, gas-laws, hydrostatic-pressure ]
narrative: >-
  Normal atmosphere pressure $P_0 = {P0:unit}$. Density of water $\rho_{water} = {rho:unit}$.
  Gravitational acceleration $g = {g:unit}$.
vars:
  - { name: h, kind: range, min: 10, max: 40, step: 0.5, unit: m, label: lake depth }
  - {
      name: V1,
      kind: range,
      min: 0.5,
      max: 3.0,
      step: 0.1,
      unit: cm^3,
      label: volume at the bottom
    }
  - { name: T1, kind: range, min: 3, max: 10, step: 0.5, unit: °C, label: bottom temperature }
  - { name: T2, kind: range, min: 12, max: 25, step: 0.5, unit: °C, label: surface temperature }
derived:
  - { name: P0, expr: "101325", unit: Pa }
  - { name: rho, expr: "997", unit: kg/m^3 }
  - { name: g, expr: "9.8", unit: m/s^2 }
  - { name: V2, expr: "V1 * 1e-6 * (P0 + rho * g * h) / P0 * (T2 + 273) / (T1 + 273)", unit: m^3 }
parts:
  - id: radius
    prompt: >-
      An air bubble at the bottom of a lake {h:unit} deep has a volume of {V1:unit}. If the
      temperature at the bottom is {T1:unit} and the top {T2:unit}, what is the radius of the bubble
      just before it reaches the surface? {_0}{_u}
    answer: (3 * V2 / (4 * pi))^(1 / 3)
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { h: 27, V1: 1.4, T1: 5.5, T2: 17.5, P0: 101325, rho: 997, g: 9.8 }
  parts:
    - { id: radius, answer: 0.010790234882701, unit: m, source: P40 }
