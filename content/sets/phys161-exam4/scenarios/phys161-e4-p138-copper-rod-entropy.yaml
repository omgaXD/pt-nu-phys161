# P138/P139/P140 — heat Q = m L_f flows through the rod from the boiling water (373 K) to the ice-water
# mixture (273 K), melting m of ice. ΔS_boiling = −Q / 373 (P138), ΔS_ice = +Q / 273 (P139), and the
# total Q (1/273 − 1/373) (P140); the rod itself is in a steady state. The base canonical values are
# P138's (P139 shares them); P140 overrides the mass.
id: phys161-e4-p138-copper-rod-entropy
title: Entropy of heat conducted through a copper rod
source: { document: PHYS161_Exam4, labels: [ P138, P139, P140 ] }
section: 2nd Law of Thermodynamics
tags: [ second-law, entropy, heat-conduction, latent-heat, multi-part ]
narrative: >-
  A student immerses one end of a copper rod in boiling water at 100°C and the other end in an
  ice-water mixture at 0°C. The sides of the rod are insulated. After steady-state conditions have
  been achieved in the rod, {m:unit} of ice melts in a certain time interval. Heat of fusion of
  water is {Lf:unit}.
vars:
  - { name: m, kind: range, min: 0.05, max: 0.40, step: 0.01, unit: kg, label: ice melted }
derived:
  - { name: Lf, expr: "334", unit: kJ/kg }
  - { name: Q, expr: "m * Lf * 1000", unit: J }
parts:
  - id: boiling-water-entropy
    prompt: >-
      For this time interval, find the entropy change of the boiling water. {_0}{_u}
    answer: -Q / 373
    unit: J/K
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: ice-water-entropy
    prompt: >-
      For this time interval, find the entropy change of the ice-water mixture. {_0}{_u}
    answer: Q / 273
    unit: J/K
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: total-entropy
    prompt: >-
      For this time interval, find the total entropy change of the entire system. {_0}{_u}
    answer: Q * (1 / 273 - 1 / 373)
    unit: J/K
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { m: 0.16, Lf: 334 }
  parts:
    - { id: boiling-water-entropy, answer: -143.27077747989, unit: J/K, source: P138 }
    - { id: ice-water-entropy, answer: 195.75091575092, unit: J/K, source: P139 }
    - { id: total-entropy, answer: 62.32016419684, unit: J/K, source: P140, vars: { m: 0.19 } }
