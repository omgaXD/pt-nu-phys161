# P62/P63 — the mean molar mass of air from its molar fractions, M = Σ x_i M_i (P63), and its
# density ρ = P M / (R T) (P62). The volume does not enter. The pressure is in atm; the temperature
# uses the source's 273 offset. The O₂ fraction is the remainder, so the fractions add up to 100%.
# The base canonical values are P62's (78/21/1); P63 overrides them (76/18.5/5.5).
id: phys161-e4-p062-air-density
title: Molar mass and density of air
source: { document: PHYS161_Exam4, labels: [ P62, P63 ] }
section: Kinetic Theory of Gases
tags: [ ideal-gas, density, molar-mass, multi-part ]
narrative: >-
  In terms of molar fraction, air contains {xN}% $N_2$, {xO}% $O_2$, and {xAr}% Ar molecules. Molar
  masses: $M_{N2}$ = 28 g/mol, $M_{O2}$ = 32 g/mol, and $M_{Ar}$ = 40 g/mol. The universal gas
  constant is $R = {R:unit}$. 1 atm = 101325 Pa 1 L = 0.001 m^3
vars:
  - { name: xN, kind: range, min: 74, max: 80, step: 0.5, label: N₂ fraction in % }
  - { name: xAr, kind: range, min: 0.5, max: 6, step: 0.5, label: Ar fraction in % }
  - { name: V, kind: range, min: 400, max: 600, step: 10, unit: mL, label: volume }
  - { name: P, kind: range, min: 0.95, max: 1.10, step: 0.01, unit: atm, label: pressure }
  - { name: T, kind: range, min: -10, max: 30, step: 1, unit: °C, label: temperature }
derived:
  - { name: xO, expr: "100 - xN - xAr" }
  - { name: R, expr: "8.31", unit: J/(mol K) }
  - { name: M, expr: "(xN * 28 + xO * 32 + xAr * 40) / 100", unit: g/mol }
parts:
  - id: molar-mass
    prompt: "What is the average molar mass of air? {_0}{_u}"
    answer: M
    unit: g/mol
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: density
    prompt: "Calculate the density of {V:unit} air under {P:unit} pressure at {T:unit}. {_0}{_u}"
    answer: P * 101325 * M / 1000 / (R * (T + 273))
    unit: kg/m^3
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { xN: 78, xAr: 1, V: 510, P: 1.04, T: 0, xO: 21, R: 8.31 }
  parts:
    - { id: density, answer: 1.3451937424789, unit: kg/m^3, source: P62 }
    - { id: molar-mass, answer: 29.4, unit: g/mol, source: P63, vars: { xN: 76, xAr: 5.5, xO: 18.5 } }
