# P10 — the block's kinetic energy all goes into melting ice at 0 °C: ½ m v² = Δm L_f.
id: phys161-e4-p010-sliding-ice-melt
title: Ice melted by friction on a sliding block
source: { document: PHYS161_Exam4, labels: [ P10 ] }
section: Temperature and heat
tags: [ heat, energy-conservation, latent-heat, friction ]
narrative: >-
  A block of ice at 0°C whose mass initially is $m = {m:unit}$ slides along a horizontal surface,
  starting at a speed $v = {v:unit}$ and finally coming to rest after traveling a certain distance.
  Latent heat of fusion for water is {Lf:unit}.
vars:
  - { name: m, kind: range, min: 10, max: 30, step: 0.1, unit: kg, label: block mass }
  - { name: v, kind: range, min: 2, max: 8, step: 0.01, unit: m/s, label: initial speed }
derived:
  - { name: Lf, expr: "334", unit: kJ/kg }
parts:
  - id: melted-mass
    prompt: >-
      Compute the mass of ice melted as a result of the friction between the block and the surface.
      (Assume that all the heat generated owing to friction goes into the block of ice.) {_0}{_u}
    answer: m * v^2 / 2 / (Lf * 1000)
    unit: kg
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { m: 19.9, v: 4.62, Lf: 334 }
  parts:
    - { id: melted-mass, answer: 0.00063585862275449, unit: kg, source: P10 }
