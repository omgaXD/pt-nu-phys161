# P94 — condensing at 100 °C (373 K) gives off Q = m L_v, so ΔS = −m L_v / 373. The mass is in g.
# The source calls 2256 kJ/kg the "heat of fusion"; it is the heat of vaporization, worded so here.
id: phys161-e4-p094-steam-condensing-entropy
