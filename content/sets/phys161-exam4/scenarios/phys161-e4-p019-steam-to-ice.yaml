# P19 — steam at T cools to 100 °C, condenses, the water cools to 0 °C and freezes:
# Q = m (c_s (T − 100) + L_v + c_w · 100 + L_f). The mass is given in g.
id: phys161-e4-p019-steam-to-ice
title: Energy removed to turn steam into ice
source: { document: PHYS161_Exam4, labels: [ P19 ] }
section: Temperature and heat
tags: [ heat, phase-change, latent-heat, specific-heat ]
narrative: >-
  Specific heat of steam is {cs:unit}. Specific heat of water is {cw:unit}. Latent heat of
  vaporization for water is {Lv:unit}. Latent heat of fusion for water is {Lf:unit}.
vars:
  - { name: m, kind: range, min: 100, max: 300, step: 1, unit: g, label: mass }
  - { name: T, kind: range, min: 110, max: 180, step: 1, unit: °C, label: steam temperature }
derived:
  - { name: cs, expr: "2.1", unit: kJ/(kg K) }
  - { name: cw, expr: "4186", unit: J/(kg K) }
  - { name: Lv, expr: "2256", unit: kJ/kg }
  - { name: Lf, expr: "334", unit: kJ/kg }
parts:
  - id: energy
    prompt: >-
      How much energy must be removed when {m:unit} of steam, at a temperature of {T:unit}, is
      cooled and frozen into {m:unit} of ice at 0°C? Provide an absolute value. {_0}{_u}
    answer: (m / 1000) * (cs * 1000 * (T - 100) + Lv * 1000 + cw * 100 + Lf * 1000)
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { m: 164, T: 147, cs: 2.1, cw: 4186, Lv: 2256, Lf: 334 }
  parts:
    - { id: energy, answer: 509597.2, unit: J, source: P19 }
