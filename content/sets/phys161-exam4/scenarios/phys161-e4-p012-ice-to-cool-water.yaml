# P12 — the ice warms from T_i to 0 °C and melts; the water cools to 0 °C:
# m_ice (c_ice (0 − T_i) + L_f) = m_w c_w T_w, so m_ice = m_w c_w T_w / (−c_ice T_i + L_f).
id: phys161-e4-p012-ice-to-cool-water
title: Ice needed to cool water to 0 °C
source: { document: PHYS161_Exam4, labels: [ P12 ] }
section: Temperature and heat
tags: [ heat, calorimetry, phase-change, latent-heat ]
narrative: >-
  Latent heat of fusion for water is {Lf:unit}. Specific heat of water is {cw:unit}. Specific heat
  of ice is {ci:unit}.
vars:
  - { name: mw, kind: range, min: 0.15, max: 0.40, step: 0.01, unit: kg, label: water mass }
  - { name: Tw, kind: range, min: 15, max: 35, step: 1, unit: °C, label: water temperature }
  - { name: Ti, kind: range, min: -25, max: -5, step: 1, unit: °C, label: ice temperature }
derived:
  - { name: Lf, expr: "334", unit: kJ/kg }
  - { name: cw, expr: "4186", unit: J/(kg K) }
  - { name: ci, expr: "2100", unit: J/(kg K) }
parts:
  - id: ice-mass
    prompt: >-
      A physics student wants to cool {mw:unit} of water, initially at {Tw:unit}, by adding ice
      initially at {Ti:unit}. How much ice should she add so that the final temperature will be 0°C
      with all the ice melted if the heat capacity of the container may be neglected? {_0}{_u}
    answer: mw * cw * Tw / (-ci * Ti + Lf * 1000)
    unit: kg
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { mw: 0.25, Tw: 22, Ti: -16, Lf: 334, cw: 4186, ci: 2100 }
  parts:
    - { id: ice-mass, answer: 0.062630576713819, unit: kg, source: P12 }
