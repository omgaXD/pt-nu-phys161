# P81/P82/P83/P84 — reversible isobaric expansion of an ideal gas from V₁ to V₂ at pressure P:
# n = P V₁ / (R T₁) (P81), T₂ = T₁ V₂ / V₁ (P82, P83) and W = P (V₂ − V₁) (P84). The pressure is in
# atm. The base canonical values are P81's; P82, P83 and P84 override them (P82 and P83 state no
# pressure and P84 no temperature; they keep P81's).
id: phys161-e4-p081-isobaric-monatomic-expansion
title: Isobaric expansion of a monatomic gas
source: { document: PHYS161_Exam4, labels: [ P81, P82, P83, P84 ] }
section: 1st Law of Thermodynamics
tags: [ first-law, isobaric, ideal-gas, work, multi-part ]
narrative: >-
  An ideal monatomic gas expands reversibly from {V1:unit} to {V2:unit} at a constant pressure of
  {P:unit}. Initial temperature is {T1:unit}. The standard atmosphere pressure is 1 atm = 101325 Pa.
vars:
  - { name: V1, kind: range, min: 1.0, max: 2.5, step: 0.1, unit: m^3, label: initial volume }
  - { name: dV, kind: range, min: 0.3, max: 2.0, step: 0.1, unit: m^3, label: volume increase }
  - { name: P, kind: range, min: 1.00, max: 2.50, step: 0.01, unit: atm, label: pressure }
  - { name: T1, kind: range, min: 260, max: 300, step: 1, unit: K, label: initial temperature }
derived:
  - { name: R, expr: "8.31", unit: J/(mol K) }
  - { name: V2, expr: "V1 + dV", unit: m^3 }
parts:
  - id: moles
    prompt: "Gas constant is $R = {R:unit}$. Find the number of moles of gas. {_0}{_u}"
    answer: P * 101325 * V1 / (R * T1)
    unit: mol
    tolerance: { rel: 0.01 }
    difficulty: 1
  - id: final-temperature
    prompt: "Find the final temperature of the gas. {_0}{_u}"
    answer: T1 * V2 / V1
    unit: K
    tolerance: { rel: 0.01 }
    difficulty: 1
  - id: work
    prompt: "Calculate the work done by the gas. {_0}{_u}"
    answer: P * 101325 * (V2 - V1)
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 1
canonical:
  vars: { V1: 1, dV: 1.7, P: 1.82, T1: 278, R: 8.31 }
  parts:
    - { id: moles, answer: 79.82559800535, unit: mol, source: P81 }
    - {
        id: final-temperature,
        answer: 395.83333333333,
        unit: K,
        source: P82,
        vars: { V1: 1.8, dV: 0.7, T1: 285 }
      }
    - {
        id: final-temperature,
        answer: 392.21052631579,
        unit: K,
        source: P83,
        vars: { V1: 1.9, dV: 0.8, T1: 276 }
      }
    - { id: work, answer: 134052.975, unit: J, source: P84, vars: { V1: 2.1, dV: 0.7, P: 1.89 } }
