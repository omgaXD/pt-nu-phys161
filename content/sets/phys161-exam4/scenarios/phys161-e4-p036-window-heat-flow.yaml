# P36/P37 — conduction through a slab: H = k A (T₁ − T₂) / d (P36); over a time t the energy is
# H t (P37, t in hours). The thickness is given in mm. The base canonical values are P36's; P37
# overrides them (it prints k = 0.8 W/(m °C)).
id: phys161-e4-p036-window-heat-flow
title: Heat flow through a window
source: { document: PHYS161_Exam4, labels: [ P36, P37 ] }
section: Temperature and heat
tags: [ heat-conduction, thermal-conductivity, multi-part ]
figure:
  id: window
  src: figures/unnamed_006_p-J8.png
  alt: >-
    A thin vertical glass slab of area A seen at an angle. Its left face is at temperature T₁ and
    its right face at T₂; arrows at the bottom mark the slab's thickness d.
narrative: >-
  A major source of heat loss from a house in cold weather is through the windows. A glass window is
  {a} m × {b} m in area and $d = {d:unit}$ thick. The temperatures at the inner and outer surfaces
  are $T_1 = {T1:unit}$ and $T_2 = {T2:unit}$, respectively. Thermal conductivity of the glass $k =
  {k:unit}$. {@fig}
vars:
  - { name: a, kind: range, min: 1.0, max: 2.5, step: 0.05, unit: m, label: window width }
  - { name: b, kind: range, min: 0.8, max: 2.0, step: 0.1, unit: m, label: window height }
  - { name: d, kind: range, min: 2.5, max: 6.0, step: 0.1, unit: mm, label: thickness }
  - { name: T1, kind: range, min: 15, max: 24, step: 0.5, unit: °C, label: inner temperature }
  - { name: dT, kind: range, min: 2, max: 10, step: 1, unit: °C, label: temperature difference }
  - { name: k, kind: choice, options: [ 0.8, 0.84 ], unit: W/(m °C), label: thermal conductivity }
  - { name: t, kind: range, min: 1, max: 12, step: 0.5, unit: h, label: time }
derived:
  - { name: T2, expr: "T1 - dT", unit: °C }
  - { name: H, expr: "k * a * b * dT / (d / 1000)", unit: W }
parts:
  - id: heat-flow
    prompt: "Calculate the rate of heat flow through the window. {_0}{_u}"
    answer: H
    unit: J/s
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: energy
    prompt: "How much energy flows through this window in {t} hours? {_0}{_u}"
    answer: H * t * 3600
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { a: 2, b: 1.3, d: 3.4, T1: 16, dT: 3, k: 0.84, t: 1 }
  parts:
    - { id: heat-flow, answer: 1927.0588235294, unit: J/s, source: P36 }
    - {
        id: energy,
        answer: 71227317.073171,
        unit: J,
        source: P37,
        vars: { a: 1.95, b: 1, d: 4.1, T1: 19.5, dT: 8, k: 0.8, t: 6.5 }
      }
