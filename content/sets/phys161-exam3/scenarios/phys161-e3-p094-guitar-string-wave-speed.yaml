# P94 — the fundamental of a string fixed at both ends has λ = 2L, so v = λ f = 2 L f. The length
# is given in cm and converted inside the formula.
id: phys161-e3-p094-guitar-string-wave-speed
title: Wave speed on a guitar string
source: { document: PHYS161_Exam3, labels: [ P94 ] }
section: Waves
tags: [ waves, string, standing-wave, fundamental, wave-speed, units ]
narrative: >-
  A string on a certain guitar of the length of {L:unit} vibrates at a fundamental frequency of
  {f:unit}.
vars:
  - { name: L, kind: range, min: 40, max: 70, step: 1, unit: cm, label: string length }
  - { name: f, kind: range, min: 180, max: 350, step: 1, unit: Hz, label: fundamental frequency }
parts:
  - id: wave-speed
    prompt: "Calculate the speed of the transverse waves on the string. {_0}{_u}"
    answer: 2 * (L / 100) * f
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 1
canonical:
  vars: { L: 52, f: 262 }
  parts:
    - { id: wave-speed, answer: 272.48, unit: m/s, source: P94 }
