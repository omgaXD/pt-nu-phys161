# P14 — energy conservation for an object launched straight up that just reaches altitude h (no
# drag, no rotation): ½ v0² − G M_E / R_E = −G M_E / (R_E + h), so
# v0 = sqrt(2 G M_E (1/R_E − 1/(R_E + h))). G, M_E and R_E are the constants the source states;
# h is given in km and converted inside the formula.
id: phys161-e3-p014-launch-speed-altitude
title: Launch speed to reach an altitude
source: { document: PHYS161_Exam3, labels: [ P14 ] }
section: Gravitation
tags: [ gravitation, energy-conservation, potential-energy, units ]
narrative: >-
  Neglect air resistance and the rotation of the Earth. The radius of the Earth is {RE:unit} and its
  mass is {ME:unit}. Gravitational constant is $G = {G:unit}$.
vars:
  - { name: h, kind: range, min: 150, max: 1500, step: 50, unit: km, label: altitude }
derived:
  - { name: RE, expr: "6.371e6", unit: m }
  - { name: ME, expr: "5.972e24", unit: kg }
  - { name: G, expr: "6.67e-11", unit: N m^2/kg^2 }
parts:
  - id: launch-speed
    prompt: >-
      With what speed must an object be launched from the Earth's surface so that it just reaches an
      altitude of {h:unit}? {_0}{_u}
    answer: sqrt(2 * G * ME * (1 / RE - 1 / (RE + h * 1000)))
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { h: 400, RE: 6371000, ME: 5.972e+24, G: 6.67e-11 }
  parts:
    - { id: launch-speed, answer: 2717.93, unit: m/s, source: P14 }
