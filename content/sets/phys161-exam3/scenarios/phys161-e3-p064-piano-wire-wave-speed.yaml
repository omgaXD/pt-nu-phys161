# P64 — transverse wave speed on a string: v = sqrt(F / μ) with μ = m / L. The mass is given in
# grams and converted inside the formula.
id: phys161-e3-p064-piano-wire-wave-speed
title: Wave speed on a piano wire
source: { document: PHYS161_Exam3, labels: [ P64 ] }
section: Waves
tags: [ waves, string, wave-speed, linear-density, units ]
narrative: ""
vars:
  - {
      name: L,
      kind: range,
      min: 1.2,
      max: 2.2,
      step: 0.1,
      decimals: 1,
      unit: m,
      label: wire length
    }
  - {
      name: m,
      kind: range,
      min: 3.0,
      max: 5.5,
      step: 0.1,
      decimals: 1,
      unit: g,
      label: wire mass
    }
  - { name: F, kind: range, min: 450, max: 850, step: 1, unit: N, label: tension }
parts:
  - id: wave-speed
    prompt: >-
      Calculate the speed of transverse waves on a steel piano wire of length {L:unit} and mass
      {m:unit} that is stretched under a tension of {F:unit}? {_0}{_u}
    answer: sqrt(F * L / (m / 1000))
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 1
canonical:
  vars: { L: 1.7, m: 4.3, F: 648 }
  parts:
    - { id: wave-speed, answer: 506.148, unit: m/s, source: P64 }
