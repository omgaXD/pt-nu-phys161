# P25 — circular orbit: G M_E / r² = (2π / T)² r with T = 1 day / n, so
# r = (G M_E T² / (4π²))^(1/3) and the altitude is h = r − R_E. G, M_E and R_E are the constants
# the source states. The upper end of the range (16 rev/day) keeps the orbit about 280 km above
# the surface; above ~17 rev/day the orbit would lie inside the Earth.
id: phys161-e3-p025-space-station-altitude
title: Altitude of the space station from its revolutions per day
source: { document: PHYS161_Exam3, labels: [ P25 ] }
section: Gravitation
tags: [ gravitation, orbits, keplers-third-law ]
narrative: >-
  The space station makes {n} revolutions per day in its orbit around the earth. The radius of Earth
  is {RE:unit}. Mass of Earth is {ME:unit}. The gravitational constant is {G:unit}.
vars:
  - {
      name: n,
      kind: range,
      min: 11.00,
      max: 16.00,
      step: 0.01,
      decimals: 2,
      label: revolutions per day
    }
derived:
  - { name: RE, expr: "6.371e6", unit: m }
  - { name: ME, expr: "5.972e24", unit: kg }
  - { name: G, expr: "6.6743e-11", unit: N m^2/kg^2 }
parts:
  - id: altitude
    prompt: >-
      Assuming a circular orbit, how high is this satellite above the surface of the earth? {_0}{_u}
    answer: (G * ME * (86400 / n)^2 / (4 * pi^2))^(1 / 3) - RE
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { n: 15.45, RE: 6371000, ME: 5.972e+24, G: 6.6743e-11 }
  parts:
    - { id: altitude, answer: 438451.032, unit: m, source: P25 }
