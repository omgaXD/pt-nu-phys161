# P60/P61 — sound in sea water travels at v = sqrt(B_w / ρ). The echolocation wavelength is
# λ = v / f, and an echo from an obstacle a distance d away returns after t = 2d / v. The density
# of sea water and the bulk modulus of water are the source's known values (constants).
id: phys161-e3-p060-echolocation-sea-water
title: Echolocation in sea water
source: { document: PHYS161_Exam3, labels: [ P60, P61 ] }
section: Waves
tags: [ waves, sound, bulk-modulus, wavelength, echo, multi-part ]
narrative: >-
  A sea animal emits an echolocation wave. Density of the sea water is $1.025\times10^{3}\
  \text{kg}/\text{m}^{3}$. Bulk modulus of water $B_w = 2.0\times10^{9}\ \text{N}/\text{m}^{2}$.
vars:
  - {
      name: f,
      kind: range,
      min: 70000,
      max: 140000,
      step: 1000,
      unit: Hz,
      label: echolocation frequency
    }
  - { name: d, kind: range, min: 50, max: 150, step: 5, unit: m, label: distance to the obstacle }
derived:
  - { name: rho, expr: "1.025e3", unit: kg/m^3 }
  - { name: Bw, expr: "2.0e9", unit: N/m^2 }
  - { name: vs, expr: "sqrt(Bw / rho)", unit: m/s }
parts:
  - id: wavelength
    prompt: >-
      Calculate the wavelength of a sea animal’s echolocation wave, if the frequencies of
      echolocation wave is {f:unit}. {_0}{_u}
    answer: vs / f
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: round-trip-time
    prompt: >-
      If an obstacle is {d:unit} from the animal, how long does it take for the echolocation wave to
      make a round trip between the animal and the object? {_0}{_u}
    answer: 2 * d / vs
    unit: s
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { f: 105000, d: 100, rho: 1025, Bw: 2e+9 }
  parts:
    - { id: wavelength, answer: 0.0133, unit: m, source: P60 }
    - { id: round-trip-time, answer: 0.143178, unit: s, source: P61 }
