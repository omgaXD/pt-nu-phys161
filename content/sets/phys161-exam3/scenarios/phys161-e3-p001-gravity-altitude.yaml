# P1/P3 — gravitational acceleration at altitude h above the Earth: g(h) = g (R_E / (R_E + h))².
# P1 inverts it for the altitude where g(h) = a: h = R_E (sqrt(g / a) − 1); P3 evaluates g(h).
# R_E and g are the constants the source states; only a (P1) and h (P3) are randomized.
id: phys161-e3-p001-gravity-altitude
title: Gravitational acceleration above the Earth
source: { document: PHYS161_Exam3, labels: [ P1, P3 ] }
section: Gravitation
tags: [ gravitation, gravitational-acceleration, altitude, multi-part ]
narrative: >-
  The radius of Earth is {RE:unit}. The gravitational acceleration on Earth is $g = {g:unit}$.
vars:
  - { name: a, kind: range, min: 4.0, max: 8.5, step: 0.1, decimals: 1, unit: m/s^2 }
  - { name: h, kind: range, min: 400, max: 1100, step: 10, unit: km, label: altitude }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
  - { name: RE, expr: "6.371e6", unit: m }
constraints:
  - "a < g" # the acceleration is weaker than at the surface, so the altitude is positive
parts:
  - id: altitude
    prompt: >-
      At what altitude above the Earth's surface would the gravitational acceleration be {a:unit}?
      {_0}{_u}
    answer: RE * (sqrt(g / a) - 1) / 1000
    unit: km
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: gravity-at-altitude
    prompt: >-
      What is the value of gravitational acceleration g {h:unit} above Earth's surface? {_0}{_u}
    answer: g * (RE / (RE + h * 1000))^2
    unit: m/s^2
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { a: 6.2, h: 720, g: 9.8, RE: 6371000 }
  parts:
    - { id: altitude, answer: 1638.858, unit: km, source: P1 }
    - { id: gravity-at-altitude, answer: 7.911, unit: m/s^2, source: P3 }
