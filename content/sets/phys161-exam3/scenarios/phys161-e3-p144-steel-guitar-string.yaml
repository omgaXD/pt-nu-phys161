# P144/P145 — the thinnest string that survives tension F has stress F / A equal to the breaking
# stress σ, so A = F / σ and r = sqrt(F / (π σ)). A fixed mass m of steel then gives the longest
# string L = m / (ρ A) = m σ / (ρ F). The mass is given in g. The base canonical values are
# P144's; P145 overrides the tension with its own.
id: phys161-e3-p144-steel-guitar-string
title: Longest and thinnest steel guitar string
source: { document: PHYS161_Exam3, labels: [ P144, P145 ] }
section: Sound
tags: [ sound, string, stress, multi-part ]
narrative: >-
  One type of steel has a density of {rho:unit} and a breaking stress of {sigma:unit}. A cylindrical
  guitar string is to be made of {m:unit} of this steel.
vars:
  - {
      name: rho,
      kind: range,
      min: 7.5e+3,
      max: 8.1e+3,
      step: 1e+2,
      sigfigs: 2,
      unit: kg/m^3,
      label: density
    }
  - {
      name: sigma,
      kind: range,
      min: 5e+8,
      max: 9e+8,
      step: 1e+8,
      sigfigs: 1,
      unit: N/m^2,
      label: breaking stress
    }
  - { name: m, kind: range, min: 4, max: 9, step: 1, unit: g, label: mass of steel }
  - { name: F, kind: range, min: 600, max: 1100, step: 10, unit: N, label: tension }
parts:
  - id: length
    prompt: >-
      What is the length of the longest and thinnest string that can be placed under a tension of
      {F:unit} without breaking? {_0}{_u}
    answer: (m / 1000) * sigma / (rho * F)
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 3
  - id: radius
    prompt: >-
      What is the radius of the longest and thinnest string that can be placed under a tension of
      {F:unit} without breaking? {_0}{_u}
    answer: sqrt(F / (pi * sigma))
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { rho: 7.8e+3, sigma: 7e+8, m: 6, F: 930 }
  parts:
    - { id: length, answer: 0.579, unit: m, source: P144 }
    - { id: radius, answer: 0.0005956, unit: m, source: P145, vars: { F: 780 } }
