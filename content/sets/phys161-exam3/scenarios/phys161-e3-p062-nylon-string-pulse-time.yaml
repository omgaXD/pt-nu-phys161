# P62 — string of varying cross-section A(x) = A0 (1 + x/L), A0 = 1e-6 m²: μ(x) = ρ A(x) and
# v(x) = sqrt(F / μ(x)), so t = ∫ dx / v = L sqrt(ρ A0 / F) ∫₀¹ sqrt(1 + u) du
#   = (2/3)(2^{3/2} − 1) L sqrt(ρ A0 / F).
# The density of nylon (1.1 g/cm³ = 1100 kg/m³) is a known material value (constant); the length
# stays a whole number of metres, as printed.
id: phys161-e3-p062-nylon-string-pulse-time
title: Pulse travel time on a tapered nylon string
source: { document: PHYS161_Exam3, labels: [ P62 ] }
section: Waves
tags: [ waves, string, wave-speed, linear-density, integration ]
narrative: >-
  A nylon string is stretched between two rigid columns such that the tension in it is {F:unit}. The
  string is of length $L = {L:unit}$ and has the cross-sectional area that varies with distance as
  $A(x) = (1 + x/L)\cdot 10^{-6}$, where $A$ is in meters squared and $x$ is in meters.
vars:
  - { name: F, kind: range, min: 120, max: 230, step: 5, unit: N, label: tension }
  - { name: L, kind: range, min: 1, max: 3, step: 1, unit: m, label: string length }
derived:
  - { name: rho, expr: "1.1", unit: g/cm^3 }
  - { name: A0, expr: "1e-6", unit: m^2 }
parts:
  - id: pulse-time
    prompt: >-
      Determine the time it takes for a transverse pulse in the string to travel from one end to the
      other. The density of nylon is {rho:unit}. {_0}{_u}
    answer: (2 / 3) * (2^1.5 - 1) * L * sqrt(rho * 1000 * A0 / F)
    unit: s
    tolerance: { rel: 0.01 }
    difficulty: 4
canonical:
  vars: { F: 175, L: 2, rho: 1.1, A0: 1e-6 }
  parts:
    - { id: pulse-time, answer: 0.006112, unit: s, source: P62 }
