# P90 — a source radiating uniformly in all directions: I ∝ 1 / r², so the level drops by
# β₁ − β₂ = 10 log₁₀(I₁ / I₂) = 20 log₁₀(r₂ / r₁), giving r₂ = r₁ · 10^((β₁ − β₂) / 20).
# I₀ = 10⁻¹² W/m² is stated by the source but cancels. The constraint keeps the level drop, and
# hence the distance ratio, near the source's (30 dB, a factor of about 32).
id: phys161-e3-p090-trumpet-level-distance
title: Distance for a lower sound level
source: { document: PHYS161_Exam3, labels: [ P90 ] }
section: Sound
tags: [ sound, sound-level, inverse-square, decibels ]
narrative: >-
  The sound from a trumpet radiates uniformly in all directions. At a distance of {r1:unit} from the
  trumpet the sound intensity level is {beta1:unit}.
vars:
  - { name: r1, kind: range, min: 2, max: 8, step: 1, unit: m, label: first distance }
  - { name: beta1, kind: range, min: 40, max: 65, step: 1, unit: dB, label: level at r1 }
  - { name: beta2, kind: range, min: 10, max: 35, step: 1, unit: dB, label: target level }
derived:
  - { name: I0, expr: "1e-12", unit: W/m^2 } # reference intensity
constraints:
  - "beta1 - beta2 >= 15" # distance ratio of at least about 5.6
  - "beta1 - beta2 <= 45" # distance ratio of at most about 178
parts:
  - id: distance
    prompt: >-
      At what distance the sound intensity level is {beta2:unit}? $I_0 = {I0:unit}$. {_0}{_u}
    answer: r1 * 10^((beta1 - beta2) / 20)
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { r1: 4, beta1: 50, beta2: 20, I0: 1e-12 }
  parts:
    - { id: distance, answer: 126.49, unit: m, source: P90 }
