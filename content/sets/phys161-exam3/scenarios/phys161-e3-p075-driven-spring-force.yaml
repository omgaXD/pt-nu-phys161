# P75 — undamped driven oscillator: the steady-state amplitude is A = F_max / (m |ω0² − ω²|),
# so F_max = |k − m ω²| A with m = W / g and ω = 2π f. The block is given by its weight and the
# amplitude in cm. Above resonance (here always) the driving force is out of phase with x.
id: phys161-e3-p075-driven-spring-force
title: Driving force of an undamped forced oscillator
source: { document: PHYS161_Exam3, labels: [ P75 ] }
section: Oscillations
tags: [ oscillations, forced-oscillation, driving-force, resonance, units ]
narrative: >-
  A block weighing {W:unit} is suspended from a spring that has a force constant of {k:unit}. The
  system is undamped ($b = 0$) and is subjected to a harmonic driving force of frequency {f:unit},
  resulting in a forced-motion amplitude of {A:unit}.
vars:
  - { name: W, kind: range, min: 30, max: 55, step: 1, unit: N, label: weight of the block }
  - { name: k, kind: range, min: 140, max: 260, step: 5, unit: N/m, label: force constant }
  - { name: f, kind: range, min: 6, max: 12, step: 1, unit: Hz, label: driving frequency }
  - {
      name: A,
      kind: range,
      min: 1.2,
      max: 2.4,
      step: 0.1,
      decimals: 1,
      unit: cm,
      label: forced-motion amplitude
    }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
  - { name: m, expr: "W / g", unit: kg }
  - { name: w, expr: "2 * pi * f", unit: rad/s }
parts:
  - id: max-driving-force
    prompt: >-
      Determine the maximum value of the driving force. The gravitational acceleration is $g =
      {g:unit}$. {_0}{_u}
    answer: abs(k - m * w^2) * A / 100
    unit: N
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { W: 42, k: 200, f: 9, A: 1.8, g: 9.8 }
  parts:
    - { id: max-driving-force, answer: 243.08, unit: N, source: P75 }
