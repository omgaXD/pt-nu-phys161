# P96 — a string fixed at both ends vibrates in its fundamental with λ = 2L, so the wave speed is
# v = 2 L f and the tension is F = μ v² = μ (2 L f)². L is given in cm and μ in g/m.
id: phys161-e3-p096-guitar-string-tension
title: Tension to tune a guitar string
source: { document: PHYS161_Exam3, labels: [ P96 ] }
section: Waves
tags: [ waves, string, standing-waves, fundamental, tension ]
narrative: >-
  A string on a certain guitar of the length of {L:unit} vibrates at a fundamental frequency of
  {f:unit}. Suppose the linear mass density of the guitar is {mu:unit}.
vars:
  - { name: L, kind: range, min: 40, max: 70, step: 1, unit: cm, label: string length }
  - { name: f, kind: range, min: 180, max: 320, step: 1, unit: Hz, label: fundamental frequency }
  - {
      name: mu,
      kind: range,
      min: 0.95,
      max: 1.80,
      step: 0.01,
      decimals: 2,
      unit: g/m,
      label: linear mass density
    }
parts:
  - id: tension
    prompt: "Find the tension required to tune the string. {_0}{_u}"
    answer: (mu / 1000) * (2 * (L / 100) * f)^2
    unit: N
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { L: 54, f: 250, mu: 1.37 }
  parts:
    - { id: tension, answer: 99.873, unit: N, source: P96 }
