# P77 — undamped driven oscillator: A = (F0 / m) / |ω² − ω0²| with ω0² = k / m. Driving above
# resonance (ω² − ω0² > 0, as the source assumes) gives ω² = k / m + F0 / (m A), f = ω / 2π.
# The spring constant stays below 8 N/m so "a {k}-N/m spring" never needs "an".
id: phys161-e3-p077-driven-spring-frequency
title: Driving frequency for a given forced amplitude
source: { document: PHYS161_Exam3, labels: [ P77 ] }
section: Oscillations
tags: [ oscillations, forced-oscillation, driving-frequency, resonance ]
narrative: >-
  Damping is negligible for a {m}-kg object hanging from a light, {k}-N/m spring. A sinusoidal force
  with an amplitude of {F0:unit} drives the system.
vars:
  - {
      name: m,
      kind: range,
      min: 0.10,
      max: 0.20,
      step: 0.01,
      decimals: 2,
      unit: kg,
      label: object mass
    }
  - {
      name: k,
      kind: range,
      min: 4.0,
      max: 7.5,
      step: 0.1,
      decimals: 1,
      unit: N/m,
      label: spring constant
    }
  - {
      name: F0,
      kind: range,
      min: 1.2,
      max: 2.2,
      step: 0.1,
      decimals: 1,
      unit: N,
      label: driving-force amplitude
    }
  - {
      name: A,
      kind: range,
      min: 0.15,
      max: 0.35,
      step: 0.01,
      decimals: 2,
      unit: m,
      label: vibration amplitude
    }
parts:
  - id: driving-frequency
    prompt: >-
      At what frequency will the force make the object vibrate with an amplitude of {A:unit}? Assume
      $(\omega^2 - \omega_0^2) > 0$. {_0}{_u}
    answer: sqrt(k / m + F0 / (m * A)) / (2 * pi)
    unit: Hz
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { m: 0.15, k: 5.8, F0: 1.7, A: 0.25 }
  parts:
    - { id: driving-frequency, answer: 1.459, unit: Hz, source: P77 }
