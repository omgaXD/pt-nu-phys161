# P92 — a pipe closed at one end has fundamental f = v / (4L). Lengthening one pipe by ΔL lowers
# its fundamental, and the beat frequency is f_beat = v / (4L) − v / (4 (L + ΔL)). ΔL is given in
# cm and converted inside the formula.
id: phys161-e3-p092-stopped-pipes-beat
title: Beats from two stopped organ pipes
source: { document: PHYS161_Exam3, labels: [ P92 ] }
section: Sound
tags: [ sound, standing-waves, organ-pipe, beats ]
narrative: >-
  Two organ pipes, open at one end but closed at the other, are each {L:unit} long. One is now
  lengthened by {dL:unit}.
vars:
  - {
      name: L,
      kind: range,
      min: 0.80,
      max: 1.60,
      step: 0.01,
      decimals: 2,
      unit: m,
      label: pipe length
    }
  - { name: dL, kind: range, min: 1, max: 4, step: 1, unit: cm, label: added length }
  - { name: v, kind: range, min: 330, max: 350, step: 1, unit: m/s, label: speed of sound }
parts:
  - id: beat-frequency
    prompt: >-
      Find the frequency of the beat they produce when playing together in their fundamental mode.
      Speed of sound in the air is {v:unit}. {_0}{_u}
    answer: v / (4 * L) - v / (4 * (L + dL / 100))
    unit: Hz
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { L: 1.28, dL: 1, v: 344 }
  parts:
    - { id: beat-frequency, answer: 0.521, unit: Hz, source: P92 }
