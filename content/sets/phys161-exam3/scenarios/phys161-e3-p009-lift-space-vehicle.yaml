# P9 — energy to raise a mass m from the Earth's surface to altitude h (no rotation, no orbital
# speed asked for): ΔU = G M_E m (1/R_E − 1/(R_E + h)). G, M_E and R_E are the constants the
# source states; h is given in km and converted inside the formula.
id: phys161-e3-p009-lift-space-vehicle
title: Energy to lift a space vehicle
source: { document: PHYS161_Exam3, labels: [ P9 ] }
section: Gravitation
tags: [ gravitation, potential-energy, units ]
narrative: >-
  Neglect the rotation of the Earth. The radius of Earth is {RE:unit}. The mass of the Earth is
  {ME:unit}. Gravitational constant is {G:unit}.
vars:
  - { name: m, kind: range, min: 5000, max: 11000, step: 100, unit: kg, label: vehicle mass }
  - { name: h, kind: range, min: 250, max: 500, step: 10, unit: km, label: height }
derived:
  - { name: RE, expr: "6.371e6", unit: m }
  - { name: ME, expr: "5.972e24", unit: kg }
  - { name: G, expr: "6.6743e-11", unit: N m^2/kg^2 }
parts:
  - id: energy
    prompt: >-
      How much energy is required to lift the {m:unit} space vehicle from Earth's surface to the
      height of the {h:unit} above the surface? {_0}{_u}
    answer: G * ME * m * (1 / RE - 1 / (RE + h * 1000))
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { m: 8000, h: 380, RE: 6371000, ME: 5.972e+24, G: 6.6743e-11 }
  parts:
    - { id: energy, answer: 28172370630.036, unit: J, source: P9 }
