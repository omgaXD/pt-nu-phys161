# P78 — the average power of a sinusoidal wave on a string is P = ½ μ ω² A² v, with μ = m / L
# and ω = 2π v / λ, so A = sqrt(2P / (μ ω² v)). The mass is given in g. The constraint keeps the
# amplitude below half a wavelength (the source's ratio is about 0.4), so no draw gives an
# absurdly large amplitude.
id: phys161-e3-p078-string-wave-power-amplitude
title: Wave amplitude for a given average power
source: { document: PHYS161_Exam3, labels: [ P78 ] }
section: Waves
tags: [ waves, string, wave-power, amplitude ]
narrative: >-
  A sinusoidal transverse wave travels on a string. The string has length {L:unit} and mass
  {m:unit}. The wave speed is {v:unit} and the wavelength is {lam:unit}.
vars:
  - { name: L, kind: range, min: 5, max: 11, step: 1, unit: m, label: string length }
  - {
      name: m,
      kind: range,
      min: 5.50,
      max: 10.00,
      step: 0.05,
      decimals: 2,
      unit: g,
      label: string mass
    }
  - { name: v, kind: range, min: 18, max: 35, step: 1, unit: m/s, label: wave speed }
  - {
      name: lam,
      kind: range,
      min: 0.15,
      max: 0.30,
      step: 0.01,
      decimals: 2,
      unit: m,
      label: wavelength
    }
  - { name: P, kind: range, min: 35, max: 70, step: 1, unit: W, label: average power }
derived:
  - { name: mu, expr: "(m / 1000) / L", unit: kg/m }
  - { name: omega, expr: "2 * pi * v / lam", unit: rad/s }
  - { name: amp, expr: "sqrt(2 * P / (mu * omega^2 * v))", unit: m }
constraints:
  - "amp < 0.5 * lam" # amplitude stays below half a wavelength
parts:
  - id: amplitude
    prompt: >-
      If the wave is to have an average power of {P:unit}, what must be the amplitude of the wave?
      {_0}{_u}
    answer: amp
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { L: 8, m: 7.65, v: 26, lam: 0.22, P: 51 }
  parts:
    - { id: amplitude, answer: 0.086, unit: m, source: P78 }
