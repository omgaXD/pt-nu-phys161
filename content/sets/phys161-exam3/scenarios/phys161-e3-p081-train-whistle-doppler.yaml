# P81 — Doppler shift of a moving source heard by a receiver at rest: on approach
# f_a = f₀ v / (v − u), on departure f_d = f₀ v / (v + u). Dividing, f_a / f_d = (v + u) / (v − u),
# so the train's speed is u = v (f_a − f_d) / (f_a + f_d). The constraints keep the approach
# frequency above the departure one by a margin that gives a realistic train speed.
id: phys161-e3-p081-train-whistle-doppler
title: Train speed from its whistle's Doppler shift
source: { document: PHYS161_Exam3, labels: [ P81 ] }
section: Sound
tags: [ sound, doppler-effect, moving-source ]
narrative: >-
  As the train passes the crossing, the receiver at the crossing notices how the sound of the
  train's whistle changes, with frequency decreasing from {fa:unit} on approach to {fd:unit} on
  departure.
vars:
  - { name: fa, kind: range, min: 500, max: 600, step: 1, unit: Hz, label: frequency on approach }
  - {
      name: fd,
      kind: range,
      min: 430,
      max: 530,
      step: 1,
      unit: Hz,
      label: frequency on departure
    }
  - { name: v, kind: range, min: 325, max: 345, step: 1, unit: m/s, label: speed of sound }
constraints:
  - "fa - fd >= 30" # a clear drop in pitch (train speed of at least about 10 m/s)
  - "fa - fd <= 120" # train speed below about 40 m/s
parts:
  - id: train-speed
    prompt: >-
      Using {v:unit} for the speed of sound in air, calculate the speed of the train. {_0}{_u}
    answer: v * (fa - fd) / (fa + fd)
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { fa: 547, fd: 475, v: 333 }
  parts:
    - { id: train-speed, answer: 23.46, unit: m/s, source: P81 }
