# P150 — the siren moves in SHM with maximum speed v_s = ω A = 2π f_p A. A listener directly
# above hears the lowest frequency while the siren moves down, away from them, at v_s:
# f_min = f v / (v + v_s). The siren frequency is given in kHz and the amplitude in cm. The shift
# is below 1% of f for every draw (as in the source: 20400.2 Hz from 20.5 kHz) but at least about
# 0.15%, so the tolerance is 0.1%: typing the unshifted siren frequency is never accepted.
id: phys161-e3-p150-oscillating-siren-min-frequency
title: Lowest frequency heard from an oscillating siren
source: { document: PHYS161_Exam3, labels: [ P150 ] }
section: Sound
tags: [ sound, doppler-effect, moving-source, simple-harmonic-motion ]
narrative: >-
  A police siren of frequency {f:unit} is attached to a vibrating platform. The platform and siren
  oscillate up and down in simple harmonic motion with amplitude {A:unit} and frequency {fp:unit}.
vars:
  - { name: f, kind: range, min: 16, max: 32, step: 0.5, unit: kHz, label: siren frequency }
  - { name: A, kind: range, min: 2.0, max: 5.0, step: 0.1, unit: cm, label: amplitude }
  - { name: fp, kind: range, min: 4, max: 10, step: 0.5, unit: Hz, label: platform frequency }
  - { name: v, kind: range, min: 335, max: 345, step: 0.5, unit: m/s, label: speed of sound }
derived:
  - { name: vs, expr: "2 * pi * fp * A / 100", unit: m/s }
parts:
  - id: min-frequency
    prompt: >-
      Find the minimum sound frequency that you would hear at a position directly above the siren.
      Use {v:unit} for the speed of sound in air. {_0}{_u}
    answer: f * 1000 * v / (v + vs)
    unit: Hz
    tolerance: { rel: 0.001 }
    difficulty: 3
canonical:
  vars: { f: 20.5, A: 3.1, fp: 8.5, v: 338.5 }
  parts:
    - { id: min-frequency, answer: 20400.2, unit: Hz, source: P150 }
