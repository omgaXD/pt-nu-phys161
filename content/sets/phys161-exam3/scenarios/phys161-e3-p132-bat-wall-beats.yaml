# P132 — the bat hears its own call at f and the echo from the wall. The wall receives
# f v / (v − u) from the approaching bat and reflects it back to the approaching bat, which hears
# f (v + u) / (v − u). The beat frequency is B = 2 f u / (v − u), so the bat's speed is
# u = B v / (2 f + B). The emitted frequency is given in kHz and converted inside the formula.
id: phys161-e3-p132-bat-wall-beats
title: Bat speed from beats with its echo
source: { document: PHYS161_Exam3, labels: [ P132 ] }
section: Sound
tags: [ sound, doppler-effect, beats, reflection ]
narrative: >-
  A bat flies toward a wall, emitting a steady sound of frequency {f:unit}. This bat hears its own
  sound plus the sound reflected by the wall.
vars:
  - {
      name: f,
      kind: range,
      min: 1.5,
      max: 3.0,
      step: 0.1,
      decimals: 1,
      unit: kHz,
      label: emitted frequency
    }
  - { name: B, kind: range, min: 4, max: 12, step: 1, unit: Hz, label: beat frequency }
  - { name: v, kind: range, min: 330, max: 350, step: 1, unit: m/s, label: speed of sound }
parts:
  - id: bat-speed
    prompt: >-
      How fast should the bat fly in order to hear a beat frequency of {B:unit}? Use speed of sound
      in air $v = {v:unit}$. {_0}{_u}
    answer: B * v / (2 * f * 1000 + B)
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 4
canonical:
  vars: { f: 2.1, B: 8, v: 344 }
  parts:
    - { id: bat-speed, answer: 0.654, unit: m/s, source: P132 }
