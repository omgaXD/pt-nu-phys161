# P139 — speed of a longitudinal wave in a fluid: v = sqrt(B / ρ) and v = f λ, so the bulk
# modulus is B = ρ (f λ)².
id: phys161-e3-p139-liquid-bulk-modulus
title: Bulk modulus of a liquid from a sound wave
source: { document: PHYS161_Exam3, labels: [ P139 ] }
section: Sound
tags: [ sound, speed-of-sound, bulk-modulus ]
narrative: >-
  In a liquid with density {rho:unit}, longitudinal waves with frequency {f:unit} are found to have
  wavelength {L:unit}.
vars:
  - { name: rho, kind: range, min: 700, max: 1500, step: 50, unit: kg/m^3, label: density }
  - { name: f, kind: range, min: 180, max: 370, step: 5, unit: Hz, label: frequency }
  - { name: L, kind: range, min: 5, max: 11, step: 1, unit: m, label: wavelength }
parts:
  - id: bulk-modulus
    prompt: "Calculate the bulk modulus of the liquid. {_0}{_u}"
    answer: rho * (f * L)^2
    unit: Pa
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { rho: 1100, f: 275, L: 8 }
  parts:
    - { id: bulk-modulus, answer: 5324000000, unit: Pa, source: P139 }
