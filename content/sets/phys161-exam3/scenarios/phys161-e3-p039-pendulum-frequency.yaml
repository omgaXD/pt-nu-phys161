# P39 — a simple pendulum of length L oscillates at f = (1 / 2π) sqrt(g / L), with L given in cm.
# The local g is part of the problem's data (not the standard 9.8 m/s²), so it is randomized too.
id: phys161-e3-p039-pendulum-frequency
title: Frequency of a simple pendulum
source: { document: PHYS161_Exam3, labels: [ P39 ] }
section: Oscillations
tags: [ oscillations, simple-pendulum, frequency ]
narrative: ""
vars:
  - { name: L, kind: range, min: 35, max: 75, step: 1, unit: cm, label: pendulum length }
  - {
      name: g,
      kind: range,
      min: 9.00,
      max: 9.90,
      step: 0.01,
      decimals: 2,
      unit: m/s^2,
      label: local gravitational acceleration
    }
parts:
  - id: frequency
    prompt: >-
      Find the frequency of a simple pendulum {L:unit} long at a location where $g = {g:unit}$.
      {_0}{_u}
    answer: sqrt(g / (L / 100)) / (2 * pi)
    unit: Hz
    tolerance: { rel: 0.01 }
    difficulty: 1
canonical:
  vars: { L: 53, g: 9.47 }
  parts:
    - { id: frequency, answer: 0.673, unit: Hz, source: P39 }
