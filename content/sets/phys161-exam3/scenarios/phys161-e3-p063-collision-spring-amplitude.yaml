# P63 — the completely inelastic collision gives the pair v' = m v / (2m) = v / 2 (the source
# family always uses two equal masses, so one variable prints both). Right after the collision
# the spring is unstretched, so ½ (2m) v'² = ½ k A², i.e. A = v' sqrt(2m / k) = v sqrt(m / (2k)).
id: phys161-e3-p063-collision-spring-amplitude
title: Amplitude after a collision with a spring-mounted mass
source: { document: PHYS161_Exam3, labels: [ P63 ] }
section: Oscillations
tags: [ oscillations, spring, inelastic-collision, amplitude ]
narrative: >-
  A {m}-kg mass is traveling to the right with a speed of {v:unit} on a smooth horizontal surface
  when it collides with and sticks to a second {m}-kg mass that is initially at rest but is attached
  to a light spring with force constant {k:unit}.
vars:
  - { name: m, kind: range, min: 10, max: 17, step: 1, unit: kg, label: mass of each body }
  - {
      name: v,
      kind: range,
      min: 1.0,
      max: 3.0,
      step: 0.1,
      decimals: 1,
      unit: m/s,
      label: initial speed
    }
  - { name: k, kind: range, min: 60, max: 120, step: 1, unit: N/m, label: force constant }
constraints:
  # Keeps the article in "A {m}-kg mass" grammatical ("an 11-kg mass").
  - "m != 11"
parts:
  - id: amplitude
    prompt: "Find the amplitude of the subsequent oscillations. {_0}{_u}"
    answer: (m * v / (2 * m)) * sqrt(2 * m / k)
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { m: 12, v: 1.6, k: 88 }
  parts:
    - { id: amplitude, answer: 0.41779, unit: m, source: P63 }
