# P135 — Doppler effect, source at rest and listener approaching: f_L = f_S (v + v_L) / v, so
# v_L = v (f_L / f_S − 1) = v (f_L − f_S) / f_S. The detected frequency is drawn as a rise above
# the emitted one, so the listener always approaches (about 17–120 m/s, around the source's
# 100 m/s).
id: phys161-e3-p135-motorcyclist-approaching-doppler
title: Speed of an approaching motorcyclist from the Doppler shift
source: { document: PHYS161_Exam3, labels: [ P135 ] }
section: Sound
tags: [ sound, doppler-effect, moving-listener ]
narrative: >-
  A car at rest is emitting alarm sound waves of frequency {f:unit}. A motorcyclist is traveling
  directly toward the car.
vars:
  - { name: f, kind: range, min: 400, max: 600, step: 5, unit: Hz, label: emitted frequency }
  - { name: df, kind: range, min: 30, max: 140, step: 1, unit: Hz, label: frequency rise }
  - { name: v, kind: range, min: 335, max: 350, step: 0.5, unit: m/s, label: speed of sound }
derived:
  - { name: f2, expr: "f + df", unit: Hz }
parts:
  - id: speed
    prompt: >-
      What is the magnitude of the motorcyclist's velocity if he detects a frequency of {f2:unit}?
      Use {v:unit} for the speed of sound in air. {_0}{_u}
    answer: v * (f2 - f) / f
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { f: 470, df: 138, v: 341.5 }
  parts:
    - { id: speed, answer: 100.27, unit: m/s, source: P135 }
