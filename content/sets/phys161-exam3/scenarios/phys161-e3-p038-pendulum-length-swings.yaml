# P38 — a simple pendulum makes N complete swings in time t, so its period is T = t / N, and
# T = 2π sqrt(L / g) gives L = g T² / (4π²) = g t² / (4π² N²). The local g is part of the data.
id: phys161-e3-p038-pendulum-length-swings
title: Pendulum length from its swings
source: { document: PHYS161_Exam3, labels: [ P38 ] }
section: Oscillations
tags: [ oscillations, simple-pendulum, period ]
narrative: ""
vars:
  - { name: N, kind: range, min: 20, max: 40, step: 1, label: number of complete swings }
  - { name: t, kind: range, min: 40, max: 75, step: 0.5, unit: s, label: elapsed time }
  - {
      name: g,
      kind: range,
      min: 8.0,
      max: 12.0,
      step: 0.1,
      decimals: 1,
      unit: m/s^2,
      label: gravitational acceleration
    }
constraints:
  - "t / N >= 1 and t / N <= 3" # a period of 1–3 s: a pendulum between about 0.2 and 2.7 m long
parts:
  - id: length
    prompt: >-
      A simple pendulum makes {N} complete swings in {t} seconds at a place where the gravitational
      acceleration is {g:unit}. What is the length of the pendulum? {_0}{_u}
    answer: g * (t / N)^2 / (4 * pi^2)
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { N: 28, t: 58.5, g: 11.3 }
  parts:
    - { id: length, answer: 1.24944, unit: m, source: P38 }
