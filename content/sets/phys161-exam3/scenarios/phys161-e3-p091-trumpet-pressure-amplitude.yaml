# P91 — from the sound intensity level, I = I₀ · 10^(β / 10), and from I = p_max² / (2 ρ v) the
# pressure amplitude is p_max = sqrt(2 ρ v I). The distance does not enter the answer. The air
# density and speed of sound are the source's values for air at 20 °C, so they are constants.
id: phys161-e3-p091-trumpet-pressure-amplitude
title: Pressure amplitude from a sound level
source: { document: PHYS161_Exam3, labels: [ P91 ] }
section: Sound
tags: [ sound, sound-level, intensity, pressure-amplitude, decibels ]
narrative: >-
  The sound from a trumpet radiates uniformly in all directions. At a distance of {r:unit} from the
  trumpet the sound intensity level is {beta:unit}.
vars:
  - { name: r, kind: range, min: 3, max: 12, step: 1, unit: m, label: distance }
  - { name: beta, kind: range, min: 50, max: 90, step: 1, unit: dB, label: sound level }
derived:
  - { name: rho, expr: "1.2", unit: kg/m^3 } # density of air at 20 °C
  - { name: v, expr: "343", unit: m/s } # speed of sound in air at 20 °C
  - { name: I0, expr: "1e-12", unit: W/m^2 } # reference intensity
parts:
  - id: pressure-amplitude
    prompt: >-
      What is the pressure amplitude at this distance? The air density at 20°C is {rho:unit} and
      speed of sound is {v:unit}. $I_0 = {I0:unit}$. {_0}{_u}
    answer: sqrt(2 * rho * v * I0 * 10^(beta / 10))
    unit: Pa
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { r: 7, beta: 70, rho: 1.2, v: 343, I0: 1e-12 }
  parts:
    - { id: pressure-amplitude, answer: 0.0907, unit: Pa, source: P91 }
