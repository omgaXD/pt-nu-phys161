# P120 — intensity of a sound wave from its pressure amplitude, I = p_max² / (2 ρ v). The air
# density 1.22 kg/m³ is the source's constant; the pressure amplitude and the speed of sound are
# its data. The source prints the answer in W; an intensity is in W/m², which the part expects.
id: phys161-e3-p120-sound-intensity-pressure
title: Sound intensity from a pressure amplitude
source: { document: PHYS161_Exam3, labels: [ P120 ] }
section: Sound
tags: [ sound, intensity, pressure-amplitude ]
narrative: ""
vars:
  - { name: v, kind: range, min: 330, max: 350, step: 0.5, unit: m/s, label: speed of sound }
  - {
      name: p,
      kind: range,
      min: 0.50,
      max: 1.20,
      step: 0.01,
      unit: Pa,
      label: pressure amplitude
    }
derived:
  - { name: rho, expr: "1.22", unit: kg/m^3 } # density of air
parts:
  - id: intensity
    prompt: >-
      Calculate the intensity of a sound wave traveling in air at {v:unit} and having a pressure
      amplitude of {p:unit}. The density of air is {rho:unit}. {_0}{_u}
    answer: p^2 / (2 * rho * v)
    unit: W/m^2
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { v: 335.5, p: 0.8, rho: 1.22 }
  parts:
    - { id: intensity, answer: 0.000781804, unit: W/m^2, source: P120 }
