# P72 — for weak damping the angular amplitude decays as θ(t) = θ₀ e^{−(b/2m) t}, so
# b/2m = ln(θ₀ / θ) / t. The pendulum length does not enter the answer. The source pasted the
# symbol b/2m as a picture; it is written here as math.
id: phys161-e3-p072-pendulum-damping-constant
title: Damping constant of a pendulum
source: { document: PHYS161_Exam3, labels: [ P72 ] }
section: Oscillations
tags: [ oscillations, damping, simple-pendulum, exponential-decay ]
narrative: >-
  A pendulum with a length of {L:unit} released from an initial angle of {theta0}°. After {t:unit},
  its amplitude has been reduced by friction to {theta}°.
vars:
  - { name: L, kind: range, min: 0.6, max: 1.5, step: 0.1, unit: m, label: pendulum length }
  - { name: theta0, kind: range, min: 10, max: 16, step: 1, unit: "°", label: initial amplitude }
  - { name: t, kind: range, min: 700, max: 1250, step: 10, unit: s, label: elapsed time }
  - {
      name: theta,
      kind: range,
      min: 2.5,
      max: 5.0,
      step: 0.1,
      decimals: 1,
      unit: "°",
      label: final amplitude
    }
parts:
  - id: damping-constant
    prompt: "What is the value of $\\frac{b}{2m}$? {_0}{_u}"
    answer: ln(theta0 / theta) / t
    unit: s^-1
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { L: 1, theta0: 13, t: 970, theta: 3.4 }
  parts:
    - { id: damping-constant, answer: 0.00138, unit: s^-1, source: P72 }
