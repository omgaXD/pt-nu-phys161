# P110/P111 — the average power of a sinusoidal wave on a string is P = ½ μ ω² A² v, with
# μ = m / L and ω = 2π v / λ (P111, amplitude in cm), so A = sqrt(2P / (μ ω² v)) (P110). The
# mass is given in g. The constraints keep both amplitudes below half a wavelength (the source's
# ratios are about 0.4 and 0.3), so no draw gives an absurdly large amplitude. The base
# canonical values are P110's; P111 overrides them.
id: phys161-e3-p110-string-wave-power-amplitude
title: Average power and amplitude of a wave on a string
source: { document: PHYS161_Exam3, labels: [ P110, P111 ] }
section: Waves
tags: [ waves, string, wave-power, amplitude, multi-part ]
narrative: >-
  A sinusoidal transverse wave travels on a string. The string has length {L:unit} and mass
  {m:unit}. The wave speed is {v:unit} and the wavelength is {lam:unit}.
vars:
  - { name: L, kind: range, min: 5, max: 11, step: 0.1, unit: m, label: string length }
  - {
      name: m,
      kind: range,
      min: 5.50,
      max: 10.00,
      step: 0.05,
      decimals: 2,
      unit: g,
      label: string mass
    }
  - { name: v, kind: range, min: 18, max: 35, step: 1, unit: m/s, label: wave speed }
  - { name: lam, kind: range, min: 0.15, max: 0.30, step: 0.005, unit: m, label: wavelength }
  - { name: P, kind: range, min: 35, max: 70, step: 1, unit: W, label: average power }
  - { name: A, kind: range, min: 4.0, max: 10.0, step: 0.1, unit: cm, label: amplitude }
derived:
  - { name: mu, expr: "(m / 1000) / L", unit: kg/m }
  - { name: omega, expr: "2 * pi * v / lam", unit: rad/s }
  - { name: amp, expr: "sqrt(2 * P / (mu * omega^2 * v))", unit: m }
constraints:
  - "amp < 0.5 * lam" # amplitude stays below half a wavelength
  - "A / 100 < 0.5 * lam" # likewise for the given amplitude
parts:
  - id: amplitude
    prompt: >-
      If the wave is to have an average power of {P:unit}, what must be the amplitude of the wave?
      {_0}{_u}
    answer: amp
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 3
  - id: average-power
    prompt: "The amplitude is {A:unit}. What is the average power carried by the wave? {_0}{_u}"
    answer: mu * omega^2 * (A / 100)^2 * v / 2
    unit: W
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { L: 8, m: 7.65, v: 26, lam: 0.22, P: 51, A: 8.2 }
  parts:
    - { id: amplitude, answer: 0.086, unit: m, source: P110 }
    - {
        id: average-power,
        answer: 23.3297,
        unit: W,
        source: P111,
        vars: { L: 6.6, m: 6.2, v: 23, lam: 0.255 }
      }
