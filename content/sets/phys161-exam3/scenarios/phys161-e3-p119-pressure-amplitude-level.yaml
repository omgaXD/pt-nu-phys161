# P119 — intensity of a sound wave from its pressure amplitude, I = p_max² / (2 ρ v), and the
# sound intensity level β = 10 log₁₀(I / I₀). The air density 1.29 kg/m³ and I₀ = 10⁻¹² W/m² are
# the source's constants; the pressure amplitude and the speed of sound are its data.
id: phys161-e3-p119-pressure-amplitude-level
title: Sound level from a pressure amplitude
source: { document: PHYS161_Exam3, labels: [ P119 ] }
section: Sound
tags: [ sound, intensity, sound-level, pressure-amplitude, decibels ]
narrative: ""
vars:
  - { name: v, kind: range, min: 330, max: 350, step: 1, unit: m/s, label: speed of sound }
  - {
      name: p,
      kind: range,
      min: 0.50,
      max: 1.20,
      step: 0.01,
      decimals: 2,
      unit: Pa,
      label: pressure amplitude
    }
derived:
  - { name: rho, expr: "1.29", unit: kg/m^3 } # density of air
  - { name: I0, expr: "1e-12", unit: W/m^2 } # reference intensity
parts:
  - id: sound-level
    prompt: >-
      Calculate the sound intensity level in decibels for a sound wave traveling in air at {v:unit}
      and having a pressure amplitude of {p:unit}. Air density is {rho:unit}. $I_0 = {I0:unit}$.
      {_0}{_u}
    answer: 10 * log10(p^2 / (2 * rho * v) / I0)
    unit: dB
    exactUnit: true
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { v: 339, p: 0.82, rho: 1.29, I0: 1e-12 }
  parts:
    - { id: sound-level, answer: 88.858, unit: dB, source: P119 }
