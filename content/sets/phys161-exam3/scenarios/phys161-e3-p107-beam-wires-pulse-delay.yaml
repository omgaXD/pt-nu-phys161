# P107 — with the center of gravity one-third of the way from A, the wire tensions are
# T_A = 2W/3 and T_B = W/3. Each wire has mass w / g, so μ = w / (g L) and a pulse takes
# t = L / v = L sqrt(μ / T) = sqrt(w L / (g T)). The delay is t_B − t_A. The source states no g;
# 9.8 m/s² (as elsewhere in the set) reproduces the printed answer.
id: phys161-e3-p107-beam-wires-pulse-delay
title: Pulse delay on two wires holding a beam
source: { document: PHYS161_Exam3, labels: [ P107 ] }
section: Waves
tags: [ waves, string, wave-speed, equilibrium, travel-time ]
figure:
  id: beam-wires
  src: figures/unnamed_003_OTxQ.png
  alt: >-
    A horizontal beam hangs from the ceiling by two vertical wires attached at its ends; upward
    arrows on the wires show their tensions. The beam's weight W is drawn as a downward arrow acting
    about one-third of the way along the beam from the left end.
narrative: >-
  A {W}-N irregular beam is hanging horizontally by its ends from the ceiling by two vertical wires
  (A and B), each {L:unit} long and weighing {w:unit}. The center of gravity of this beam is
  one-third of the way along the beam from the end where wire A is attached. {@fig}
vars:
  - { name: W, kind: range, min: 1200, max: 2200, step: 50, unit: N, label: beam weight }
  - {
      name: L,
      kind: range,
      min: 0.90,
      max: 1.60,
      step: 0.05,
      decimals: 2,
      unit: m,
      label: wire length
    }
  - {
      name: w,
      kind: range,
      min: 1.0,
      max: 2.0,
      step: 0.1,
      decimals: 1,
      unit: N,
      label: wire weight
    }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
parts:
  - id: time-delay
    prompt: >-
      If you pluck both strings at the same time at the beam, what is the time delay between the
      arrival of the two pulses at the ceiling? {_0}{_u}
    answer: sqrt(w * L / (g * W / 3)) - sqrt(w * L / (g * 2 * W / 3))
    unit: s
    tolerance: { rel: 0.01 }
    difficulty: 4
canonical:
  vars: { W: 1700, L: 1.25, w: 1.5, g: 9.8 }
  parts:
    - { id: time-delay, answer: 0.00538, unit: s, source: P107 }
