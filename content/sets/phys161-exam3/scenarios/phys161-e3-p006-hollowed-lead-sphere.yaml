# P6 — superposition: the hollowed sphere = full sphere (M, centre O) minus the removed sphere of
# radius R/2 and mass M/8, centred R/2 from O. In the figure the hollow is on the far side of O
# from m, so the removed sphere is d + R/2 away from m:
# F = G m (M / d² − (M/8) / (d + R/2)²). R is given in cm and converted inside the formula.
# The figure prints only symbols (d, R, m), so every parameter is randomized; d ≥ 0.5 m always
# exceeds R, so the small sphere stays outside the lead sphere.
id: phys161-e3-p006-hollowed-lead-sphere
title: Force from a hollowed-out lead sphere
source: { document: PHYS161_Exam3, labels: [ P6 ] }
section: Gravitation
tags: [ gravitation, superposition, spheres ]
figure:
  id: hollowed-sphere
  src: figures/unnamed_006_LYNB.png
  alt: >-
    A large stippled lead sphere of radius R with a white spherical hollow inside it: the hollow's
    diameter runs from the sphere's left edge to its centre, so the hollow touches the left surface
    and passes through the centre. To the right, a small dark sphere labelled m; the distance d is
    marked from the centre of the lead sphere to the centre of the small sphere, and R from the
    centre of the lead sphere to its right edge.
narrative: >-
  Spherical hollow is made in a lead sphere of radius $R = {R:unit}$ such that its surface touches
  the outside surface of a lead sphere and passes through its center as shown in the figure below.
  The mass of the sphere before hollowing was $M = {M:unit}$. Gravitational constant is {G:unit}.
  {@fig}
vars:
  - { name: R, kind: range, min: 8.0, max: 16.0, step: 0.1, decimals: 1, unit: cm }
  - { name: M, kind: range, min: 16.0, max: 32.0, step: 0.1, decimals: 1, unit: kg }
  - { name: m, kind: range, min: 1.5, max: 3.5, step: 0.1, decimals: 1, unit: kg }
  - { name: d, kind: range, min: 0.50, max: 1.00, step: 0.01, decimals: 2, unit: m }
derived:
  - { name: G, expr: "6.67e-11", unit: N m^2/kg^2 }
parts:
  - id: force
    prompt: >-
      Find the magnitude of the gravitational force between the hollowed-out lead sphere and a small
      sphere of mass $m = {m:unit}$, located at distance $d = {d:unit}$ from the center of the lead
      sphere. {_0}{_u}
    answer: G * m * (M / d^2 - (M / 8) / (d + R / 200)^2)
    unit: N
    tolerance: { rel: 0.01 }
    difficulty: 4
canonical:
  vars: { R: 12.4, M: 24.8, m: 2.4, d: 0.75, G: 6.67e-11 }
  parts:
    - { id: force, answer: 6.305e-9, unit: N, source: P6 }
