# P142 — torques about each end give the wire tensions: with the cube a fraction x/x2 of the
# way from A to B, T_A = W/2 + w (1 − x/x2) and T_B = W/2 + w x/x2. Each wire (length L, mass m,
# μ = m / L) vibrates in its fundamental at f = sqrt(T / μ) / (2 L), and the beat frequency is
# f_B − f_A. The length is given in cm and the mass in g.
id: phys161-e3-p142-bar-wires-beats
title: Beats from two wires holding a loaded bar
source: { document: PHYS161_Exam3, labels: [ P142 ] }
section: Sound
tags: [ sound, beats, string-fundamental, equilibrium ]
figure:
  id: fig
  src: figures/unnamed_006_OTxQ.png
  alt: >-
    A horizontal bar hangs from a ceiling by two vertical wires, wire A at its left end and wire B
    at its right end. A small cube rests on the bar about three quarters of the way from A to B.
narrative: >-
  A uniform {W}-N bar is supported horizontally by two identical wires A and B. A small {w}-N cube
  of lead is placed {x}/{x2} of the way from A to B. The wires are each {L:unit} long and have a
  mass of {m:unit}. {@fig}
vars:
  - { name: W, kind: range, min: 100, max: 200, step: 5, unit: N, label: weight of the bar }
  - { name: w, kind: range, min: 120, max: 250, step: 5, unit: N, label: weight of the cube }
  # The figure draws the cube three quarters of the way from A to B, so the fraction stays fixed.
  - { name: x, kind: choice, options: [ 3 ] }
  - { name: x2, kind: choice, options: [ 4 ] }
  - { name: L, kind: range, min: 40, max: 75, step: 1, unit: cm, label: wire length }
  - { name: m, kind: range, min: 4, max: 9, step: 1, unit: g, label: wire mass }
derived:
  - { name: TA, expr: "W / 2 + w * (1 - x / x2)", unit: N }
  - { name: TB, expr: "W / 2 + w * x / x2", unit: N }
  - { name: mu, expr: "(m / 1000) / (L / 100)", unit: kg/m }
parts:
  - id: beat-frequency
    prompt: >-
      If both of them are simultaneously plucked at the center, what is the frequency of the beats
      that they will produce when vibrating in their fundamental? {_0}{_u}
    answer: (sqrt(TB / mu) - sqrt(TA / mu)) / (2 * L / 100)
    unit: Hz
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { W: 150, w: 185, x: 3, x2: 4, L: 56, m: 6 }
  parts:
    - { id: beat-frequency, answer: 31.129, unit: Hz, source: P142 }
