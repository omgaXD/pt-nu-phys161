# P60 — one (x, v) pair fixes ω² = v² / (A² − x²). At the endpoint the plate's acceleration is
# largest, ω² A, and static friction alone must supply it to the carrot slice: μs g = ω² A, so
# μs = v² A / ((A² − x²) g).
id: phys161-e3-p060-plate-carrot-friction
title: Carrot slice on an oscillating plate
source: { document: PHYS161_Exam3, labels: [ P60 ] }
section: Oscillations
tags: [ oscillations, simple-harmonic-motion, maximum-acceleration, static-friction ]
narrative: >-
  A plate is sliding back and forth in a simple harmonic motion with an amplitude of {A:unit} on a
  horizontal surface. At a point {x:unit} away from equilibrium, the speed of the plate is {v:unit}.
  In the center of the plate is a carrot slice.
vars:
  - {
      name: A,
      kind: range,
      min: 0.1,
      max: 0.4,
      step: 0.1,
      decimals: 1,
      unit: m,
      label: amplitude
    }
  - {
      name: x,
      kind: range,
      min: 0.02,
      max: 0.08,
      step: 0.01,
      decimals: 2,
      unit: m,
      label: displacement
    }
  - { name: v, kind: range, min: 0.2, max: 0.6, step: 0.1, decimals: 1, unit: m/s, label: speed }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
  - { name: mu, expr: "v^2 * A / ((A^2 - x^2) * g)" }
constraints:
  # The given point lies well inside the path, so A² − x² is not a near-zero difference.
  - "x <= 0.8 * A"
  # A plausible coefficient of static friction.
  - "mu >= 0.03 and mu <= 1"
parts:
  - id: static-friction
    prompt: >-
      If the carrot slice is just on the verge of slipping at the endpoint of the path, what is the
      coefficient of static friction between the carrot slice and the plate? The gravitational
      acceleration is $g = {g:unit}$. {_0}
    answer: mu
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { A: 0.1, x: 0.06, v: 0.3, g: 9.8 }
  parts:
    - { id: static-friction, answer: 0.1435, source: P60 }
