# P82 — an arrow embeds in a block at rest (perfectly inelastic): V = m v / (M + m). The kinetic
# energy lost in the strike is ½ m v² − ½ (M + m) V² = ½ m v² · M / (M + m). The friction
# coefficient and g are given in the source but do not enter the collision. Arrow mass is in g.
# Sibling of P81 (phys161-e2-p081-arrow-block-friction-slide), same variable names.
id: phys161-e2-p082-arrow-block-energy-lost
title: Kinetic energy lost when an arrow sticks in a block
source: { document: PHYS161_Exam2, labels: [ P82 ] }
section: Conservation of linear momentum
tags: [ momentum, inelastic-collision, kinetic-energy ]
narrative: >-
  A block of mass {M:unit} stays at rest on a horizontal surface whose coefficient of kinetic
  friction is {mu}. An arrow of mass {m:unit} strikes the block with a speed of {v:unit} and gets
  stuck in the block.
vars:
  - {
      name: M,
      kind: range,
      min: 0.9,
      max: 1.7,
      step: 0.1,
      decimals: 1,
      unit: kg,
      label: block mass
    }
  - {
      name: mu,
      kind: range,
      min: 0.15,
      max: 0.35,
      step: 0.01,
      decimals: 2,
      label: coefficient of kinetic friction
    }
  - { name: m, kind: range, min: 165, max: 305, step: 5, unit: g, label: arrow mass }
  - { name: v, kind: range, min: 18, max: 34, step: 1, unit: m/s, label: arrow speed }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
  - { name: V, expr: "(m / 1000) * v / (M + m / 1000)", unit: m/s }
parts:
  - id: energy-lost
    prompt: >-
      How much kinetic energy is lost during the collision? The gravitational acceleration is $g =
      {g:unit}$. {_0}{_u}
    answer: 0.5 * (m / 1000) * v^2 - 0.5 * (M + m / 1000) * V^2
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { M: 1.3, mu: 0.24, m: 235, v: 26, g: 9.8 }
  parts:
    - { id: energy-lost, answer: 67.2697, unit: J, source: P82 }
