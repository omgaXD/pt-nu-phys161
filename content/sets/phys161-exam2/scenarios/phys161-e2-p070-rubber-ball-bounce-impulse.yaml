# P70 — a ball released from h hits the floor at v₁ = √(2 g h) (down) and rises to a fraction p of
# h, leaving at v₂ = √(2 g p h) (up), so the floor's impulse is J = m √(2 g h) (1 + √p).
id: phys161-e2-p070-rubber-ball-bounce-impulse
title: Impulse from the floor on a bouncing ball
source: { document: PHYS161_Exam2, labels: [ P70 ] }
section: Impulse and collisions
tags: [ impulse, momentum ]
narrative: >-
  A rubber ball of mass {m:unit} is released from rest at height {h:unit} above the floor. After its
  first bounce, it rises to {pct}% of its original height. The gravitational acceleration is $g =
  {g:unit}$.
vars:
  - {
      name: m,
      kind: range,
      min: 0.40,
      max: 0.70,
      step: 0.01,
      decimals: 2,
      unit: kg,
      label: ball mass
    }
  - {
      name: h,
      kind: range,
      min: 1.5,
      max: 3.0,
      step: 0.1,
      decimals: 1,
      unit: m,
      label: drop height
    }
  - { name: pct, kind: range, min: 50, max: 95, step: 1, label: rebound percentage }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
  - { name: p, expr: "pct / 100" }
parts:
  - id: impulse
    prompt: >-
      What impulse does the floor exert on this ball during its first bounce? {_0}{_u}
    answer: m * sqrt(2 * g * h) * (1 + sqrt(p))
    unit: N s
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { m: 0.55, h: 2.1, pct: 75, g: 9.8 }
  parts:
    - { id: impulse, answer: 6.584, unit: N s, source: P70 }
