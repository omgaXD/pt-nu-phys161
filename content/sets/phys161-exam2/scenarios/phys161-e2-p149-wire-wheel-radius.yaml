# P149 — a wire of length L is shaped into a rim (circumference 2πR) plus four spokes (length R
# each) with nothing wasted: 2πR + 4R = L, so R = L / (2π + 4). The wire's mass does not enter.
id: phys161-e2-p149-wire-wheel-radius
title: Wheel bent from a wire
source: { document: PHYS161_Exam2, labels: [ P149 ] }
section: Angular momentum
tags: [ geometry, moment-of-inertia ]
narrative: >-
  A stiff uniform wire of mass {m:unit} and length {L:unit} is cut, bent, and the parts soldered
  together so that it forms a circular wheel having four identical spokes coming out from the center
  to the rim. None of the wire is wasted, and you can neglect the mass of the solder.
vars:
  - { name: m, kind: range, min: 4.0, max: 7.0, step: 0.1, decimals: 1, unit: kg, label: mass }
  - {
      name: L,
      kind: range,
      min: 1.25,
      max: 2.25,
      step: 0.05,
      decimals: 2,
      unit: m,
      label: length
    }
parts:
  - id: radius
    prompt: "What is the radius of this wheel? {_0}{_u}"
    answer: L / (2 * pi + 4)
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { m: 5.4, L: 1.75 }
  parts:
    - { id: radius, answer: 0.170181, unit: m, source: P149 }
