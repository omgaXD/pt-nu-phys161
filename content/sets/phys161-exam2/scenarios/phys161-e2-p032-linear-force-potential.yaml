# P32/P33 — a conservative force F(x) = (a x + b) N along the x axis. Work done by the force
# from x₁ to x₂: W = ∫F dx = (a/2)(x₂² − x₁²) + b (x₂ − x₁); the change in potential energy is
# ΔU = −W. The particle's mass is a red herring. The base canonical values are P32's; P33
# overrides the constant term with its own and asks about a second interval [x₃, x₄].
id: phys161-e2-p032-linear-force-potential
title: Work and potential energy of a linear force
source: { document: PHYS161_Exam2, labels: [ P32, P33 ] }
section: Potential energy
tags: [ potential-energy, work, calculus, multi-part ]
narrative: >-
  A single conservative force acts on a {m}-kg particle. The equation $F = ({a}x + {b})$ N describes
  the force, where $x$ is in meters.
vars:
  - { name: m, kind: range, min: 2.00, max: 8.00, step: 0.25, decimals: 2, unit: kg }
  - { name: a, kind: range, min: 1, max: 5, step: 1, unit: N/m }
  - { name: b, kind: range, min: 2, max: 9, step: 1, unit: N }
  - { name: x1, kind: range, min: 0.5, max: 3.0, step: 0.5, unit: m }
  - { name: x2, kind: range, min: 6.0, max: 10.0, step: 0.5, unit: m }
  - { name: x3, kind: range, min: 0.5, max: 3.0, step: 0.5, unit: m }
  - { name: x4, kind: range, min: 6.0, max: 10.0, step: 0.5, unit: m }
parts:
  - id: potential-change
    prompt: >-
      As the particle moves along the x axis from $x = {x1}$ m to $x = {x2}$ m, calculate the change
      in the potential energy of the system. {_0}{_u}
    answer: -(a / 2 * (x2^2 - x1^2) + b * (x2 - x1))
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: work
    prompt: >-
      As the particle moves along the x axis from $x = {x3}$ m to $x = {x4}$ m, calculate the work
      done by this force on the particle. {_0}{_u}
    answer: a / 2 * (x4^2 - x3^2) + b * (x4 - x3)
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { m: 5, a: 2, b: 6, x1: 1, x2: 8, x3: 2.5, x4: 9.5 }
  parts:
    - { id: potential-change, answer: -105, unit: J, source: P32 }
    - { id: work, answer: 112, unit: J, source: P33, vars: { b: 4 } }
