id: phys161-e2-loop-min-height
title: Minimum release height for a loop-the-loop
source: { document: PHYS161_Exam2, labels: [ P54 ] }
section: Energy conservation
tags: [ energy-conservation, circular-motion ]
figure:
  id: loop
  src: figures/unnamed_028_GNcJ.png
  alt: >-
    A roller-coaster track descends from point A at height h into a vertical circular loop of radius
    R. Point B is the top of the loop and point C is on its side.
narrative: >-
  A car in an amusement park ride rolls without friction around the track. It starts from rest at
  point A at a height $h$ above the bottom of the loop. The radius of the loop is {R:unit}. {@fig}
