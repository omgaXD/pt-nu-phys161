# P131 — thin spherical shell (I = ⅔ m R², R = d/2) with four small masses mp on its surface;
# the spin axis passes through two of them (zero lever arm), so I = ⅔ m R² + 2 mp R².
# cm → m inside the formula.
id: phys161-e2-p131-shell-masses-inertia
title: Moment of inertia of a spherical shell with masses
source: { document: PHYS161_Exam2, labels: [ P131 ] }
section: Torque
tags: [ moment-of-inertia, sphere, point-mass, unit-conversion ]
figure:
  id: shell-masses
  src: figures/unnamed_016_GNcJ.png
  alt: >-
    A sphere with a vertical dashed line through its center labelled "Spin axis". Four small red
    dots sit on its surface, equally spaced around a great circle: two at the top and bottom, on the
    spin axis, and two at the left and right sides.
narrative: >-
  A uniform, {m}-kg spherical shell {d:unit} in diameter has four small {mp}-kg masses attached to
  its outer surface and equally spaced around it. This combination spins about an axis running
  through the center of the sphere and two of the small masses. {@fig}
vars:
  - { name: m, kind: range, min: 5.5, max: 9.5, step: 0.1, decimals: 1, unit: kg }
  - { name: d, kind: range, min: 50, max: 90, step: 1, unit: cm, label: diameter }
  - { name: mp, kind: range, min: 1.0, max: 2.2, step: 0.1, decimals: 1, unit: kg }
parts:
  - id: moment-of-inertia
    prompt: "What is the moment of inertia of the combination about this axis? {_0}{_u}"
    answer: (2 / 3 * m + 2 * mp) * (d / 200)^2
    unit: kg m^2
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { m: 7.3, d: 69, mp: 1.6 }
  parts:
    - { id: moment-of-inertia, answer: 0.960135, unit: kg m^2, source: P131 }
