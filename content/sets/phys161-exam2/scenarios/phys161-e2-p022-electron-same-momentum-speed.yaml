# P22 — an electron with the same momentum as a proton moving at speed v_p:
# m_e v_e = m_p v_p, so v_e = (m_p / m_e) v_p. The mass ratio 1836 is a physical constant.
# The proton speed stays at or below 7×10⁴ m/s so the (non-relativistic) electron speed stays
# below about 0.43 c, as in the source (0.34 c).
id: phys161-e2-p022-electron-same-momentum-speed
title: Electron with the same momentum as a proton
source: { document: PHYS161_Exam2, labels: [ P22 ] }
section: Kinetic energy
tags: [ momentum ]
narrative: >-
  The mass of a proton is {ratio} times the mass of an electron. A proton is traveling at a speed of
  {vp:unit}.
vars:
  - { name: vp, kind: range, min: 3e+4, max: 7e+4, step: 1e+3, unit: m/s, label: proton speed }
derived:
  - { name: ratio, expr: "1836" }
parts:
  - id: electron-speed
    prompt: "At what speed would an electron have the same momentum as the proton? {_0}{_u}"
    answer: ratio * vp
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 1
canonical:
  vars: { vp: 5.5e+4 }
  parts:
    - { id: electron-speed, answer: 1.0098e+8, unit: m/s, source: P22 }
