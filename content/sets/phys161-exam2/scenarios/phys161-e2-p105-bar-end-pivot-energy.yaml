# P105 — a thin uniform bar (mass m, length L) pivoted at one end: I = ⅓ m L². It makes n
# revolutions every T seconds, so ω = 2π n / T and K = ½ I ω².
id: phys161-e2-p105-bar-end-pivot-energy
title: Kinetic energy of a bar pivoted at one end
source: { document: PHYS161_Exam2, labels: [ P105 ] }
section: Moment of Inertia
tags: [ moment-of-inertia, rod, rotational-energy ]
narrative: >-
  A thin, uniform {m}-kg bar that is {L:unit} long rotates uniformly about a pivot at one end,
  making {n} complete revolutions every {T} seconds.
vars:
  - { name: m, kind: range, min: 8, max: 14, step: 1, unit: kg, label: mass }
  - { name: L, kind: range, min: 1.8, max: 3.4, step: 0.1, decimals: 1, unit: m, label: length }
  - { name: n, kind: range, min: 3, max: 9, step: 1, label: revolutions }
  - { name: T, kind: range, min: 2, max: 5, step: 1, unit: s, label: time }
derived:
  - { name: omega, expr: "2 * pi * n / T", unit: rad/s }
parts:
  - id: kinetic-energy
    prompt: "What is the kinetic energy of this bar? {_0}{_u}"
    answer: 1 / 2 * (m * L^2 / 3) * omega^2
    unit: J
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { m: 11, L: 2.6, n: 6, T: 3 }
  parts:
    - { id: kinetic-energy, answer: 1957.08, unit: J, source: P105 }
