# P147/P148 — a block (mass m) circles a hole on a frictionless table at radius r₀ and speed v₀;
# pulling the string exerts no torque about the hole, so v r = v₀ r₀. The tension is
# T = m v² / r = m (v₀ r₀)² / r³, and the string breaks when T = F:
# r = (m (v₀ r₀)² / F)^(1/3), v = v₀ r₀ / r. The base canonical values are P147's; P148 overrides
# them with its own. The breaking strength carries no decimals so that 32 N and 34.5 N print as
# the source does.
id: phys161-e2-p147-string-hole-block
title: Block on a string pulled through a hole
source: { document: PHYS161_Exam2, labels: [ P147, P148 ] }
section: Angular momentum
tags: [ angular-momentum, circular-motion, multi-part ]
figure:
  id: fig
  src: figures/unnamed_003_GNcJ.png
  alt: >-
    A small red block slides on a flat horizontal surface in a blue circular path around a hole at
    the center; a string runs from the block to the hole and down through it, where a red arrow
    shows it being pulled downward. A green arrow on the block shows its velocity tangent to the
    circle.
narrative: >-
  A small block with mass {m:unit} is attached to a string passing through a hole in a frictionless,
  horizontal surface. The block is originally revolving in a circle with a radius of {r:unit} about
  the hole with a tangential speed of {v:unit}. The string is then pulled slowly from below,
  shortening the radius of the circle in which the block revolves. The breaking strength of the
  string is {F:unit}. {@fig}
vars:
  - {
      name: m,
      kind: range,
      min: 0.35,
      max: 0.65,
      step: 0.05,
      decimals: 2,
      unit: kg,
      label: mass
    }
  - {
      name: r,
      kind: range,
      min: 0.60,
      max: 0.90,
      step: 0.05,
      decimals: 2,
      unit: m,
      label: radius
    }
  - { name: v, kind: range, min: 3.00, max: 5.00, step: 0.25, decimals: 2, unit: m/s }
  - { name: F, kind: range, min: 25, max: 45, step: 0.5, unit: N, label: breaking strength }
derived:
  - { name: rb, expr: "(m * (v * r)^2 / F)^(1/3)", unit: m }
constraints:
  - "m * v^2 / r < F" # the string holds at the initial radius
parts:
  - id: radius-at-break
    prompt: "What is the radius of the circle when the string breaks? {_0}{_u}"
    answer: rb
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 3
  - id: speed-at-break
    prompt: "What is the speed of the block when the string breaks? {_0}{_u}"
    answer: v * r / rb
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { m: 0.45, r: 0.75, v: 3.75, F: 32 }
  parts:
    - { id: radius-at-break, answer: 0.481, unit: m, source: P147 }
    - {
        id: speed-at-break,
        answer: 5.84748,
        unit: m/s,
        source: P148,
        vars: { m: 0.55, v: 4.25, F: 34.5 }
      }
