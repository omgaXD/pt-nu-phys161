# P55 — a car starts from rest at the minimum height for a frictionless loop of radius R. At the
# top, gravity alone supplies the centripetal force: v_top² = g R, so h_min = 2.5 R. Energy
# conservation down to the bottom of the loop: ½ m v² = m g (2.5 R), so v = √(5 g R).
# The figure prints only the symbols h and R and the point labels A, B, C.
id: phys161-e2-p055-loop-bottom-speed
title: Speed at the bottom of a loop-the-loop
source: { document: PHYS161_Exam2, labels: [ P55 ] }
section: Energy conservation
tags: [ energy-conservation, circular-motion ]
figure:
  id: loop
  src: figures/unnamed_015_GNcJ.png
  alt: >-
    A roller-coaster track descends from point A at height h into a vertical circular loop of radius
    R. Point B is the top of the loop and point C is on its side.
narrative: >-
  A car in an amusement park ride rolls without friction around a vertical loop of radius {R:unit}.
  It starts from rest at the minimum height that allows it to maintain contact with the track at the
  top of the loop. The gravitational acceleration is $g = {g:unit}$. {@fig}
vars:
  - { name: R, kind: range, min: 10, max: 25, step: 1, unit: m }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
parts:
  - id: speed-at-bottom
    prompt: "What is the speed of the car at the bottom of the loop? {_0}{_u}"
    answer: sqrt(5 * g * R)
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { R: 17, g: 9.8 }
  parts:
    - { id: speed-at-bottom, answer: 28.8617, unit: m/s, source: P55 }
