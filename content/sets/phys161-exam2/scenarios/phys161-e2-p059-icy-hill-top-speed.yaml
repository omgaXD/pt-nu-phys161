# P59 — a block slides up a frictionless hill whose flat top is h above the base. Energy
# conservation: ½ m v_top² = ½ m v² − m g h, so v_top = √(v² − 2 g h). The mass is not needed.
# The figure (shared with P58) prints only the symbols h₁, h₂ and d; here h₁ is the height h.
id: phys161-e2-p059-icy-hill-top-speed
title: Speed at the top of an icy hill
source: { document: PHYS161_Exam2, labels: [ P59 ] }
section: Energy conservation
tags: [ energy-conservation, kinetic-energy ]
figure:
  id: icy-hill
  src: figures/unnamed_007_GNcJ.png
  alt: >-
    A block on level ground at the left moves to the right toward a hill that rises to a flat top at
    height h₁ above the base. Beyond the top the ground drops into a pit; the far side of the pit is
    a lower plateau at height h₂ above the base, a horizontal distance d from the edge of the top.
narrative: >-
  A {m}-kg block slides over a smooth, icy hill. The top of the hill is horizontal and {h:unit}
  higher than its base. The block has a speed of {v:unit} at the base of the hill. The gravitational
  acceleration is $g = {g:unit}$. {@fig}
vars:
  - { name: m, kind: range, min: 2.5, max: 5.0, step: 0.1, decimals: 1, unit: kg }
  - { name: h, kind: range, min: 15, max: 35, step: 1, unit: m }
  - { name: v, kind: range, min: 35.0, max: 55.0, step: 0.5, decimals: 1, unit: m/s }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
constraints:
  # The block reaches the top with a clear margin (no near-zero square root).
  - "v^2 - 2 * g * h > 0.25 * v^2"
parts:
  - id: speed-at-top
    prompt: "What is its speed at the top of the hill? {_0}{_u}"
    answer: sqrt(v^2 - 2 * g * h)
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 1
canonical:
  vars: { m: 3.3, h: 24, v: 45.5, g: 9.8 }
  parts:
    - { id: speed-at-top, answer: 39.9981, unit: m/s, source: P59 }
