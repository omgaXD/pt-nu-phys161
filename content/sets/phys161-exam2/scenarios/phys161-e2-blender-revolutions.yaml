# Seeded from fixtures/corpus/scenarios/c14-blender-revolutions.yaml (c14-blender-revolutions).

# C14 — unit conversion inside the problem (P108). The formula converts rad to
# revolutions; "provide the answer in decimals" fixes the expected form, so the
# answer is a bare number of revolutions.
id: phys161-e2-blender-revolutions
title: Revolutions of a blender blade
source: { document: PHYS161_Exam2, labels: [ P108 ] }
section: Rotation
tags: [ rotation, kinematics, unit-conversion ]
narrative: >-
  The rotating blade of a blender turns with constant angular acceleration {alpha:unit}. At some
  moment of time it reaches an angular velocity of {omega:unit}, starting from rest.
vars:
  - { name: alpha, kind: range, min: 0.8, max: 2.0, step: 0.1, decimals: 1, unit: rad/s^2 }
  - { name: omega, kind: range, min: 20, max: 60, step: 1, unit: rad/s }
parts:
  - id: revolutions
    prompt: >-
      Through how many revolutions does the blade turn in this time interval? Provide the answer in
      decimals. {_0}
    answer: omega^2 / (2 * alpha) / (2 * pi)
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { alpha: 1.3, omega: 48 }
  parts:
    - { id: revolutions, answer: 141.04, source: P108 }
