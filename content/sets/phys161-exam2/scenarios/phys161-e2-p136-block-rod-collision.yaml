# P136 — a block (mass m) slides from rest down a frictionless height h, reaching v = √(2 g h),
# and sticks to the lower end of a uniform rod (mass M, length l) hanging from a pivot at its
# top. Angular momentum about the pivot: m v l = (⅓ M l² + m l²) ω, so
# ω = m √(2 g h) / ((M/3 + m) l).
id: phys161-e2-p136-block-rod-collision
title: Block sticking to a hanging rod
source: { document: PHYS161_Exam2, labels: [ P136 ] }
section: Angular momentum
tags: [ angular-momentum, inelastic-collision, energy-conservation, rod ]
figure:
  id: fig
  src: figures/unnamed_004_GNcJ.gif
  alt: >-
    A uniform rod labelled M, l hangs vertically from a pivot O at its upper end. On the right, a
    block m starts at height h on a curved ramp and slides down to the floor, where it meets the
    lower end of the rod. A dashed outline shows the rod, with the block stuck to its lower end,
    swung to the left through an angle θ from the vertical.
narrative: >-
  A block of mass $m = {m:unit}$ slides from rest down a frictionless surface through a height $h =
  {h:unit}$. At the bottom it strikes the lower end of a uniform vertical rod of mass $M = {M:unit}$
  and length $l = {l:unit}$ that hangs from a frictionless pivot O at its upper end, and sticks to
  it (see Figure below). {@fig}
vars:
  - { name: m, kind: range, min: 1, max: 3, step: 1, unit: kg, label: block mass }
  - {
      name: h,
      kind: range,
      min: 0.40,
      max: 0.92,
      step: 0.01,
      decimals: 2,
      unit: m,
      label: height
    }
  - {
      name: M,
      kind: range,
      min: 2.5,
      max: 4.7,
      step: 0.1,
      decimals: 1,
      unit: kg,
      label: rod mass
    }
  - {
      name: l,
      kind: range,
      min: 1.8,
      max: 3.4,
      step: 0.1,
      decimals: 1,
      unit: m,
      label: rod length
    }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
parts:
  - id: angular-velocity
    prompt: >-
      Find the angular velocity of the rod and block immediately after the collision. The
      gravitational acceleration is $g = {g:unit}$. {_0}{_u}
    answer: m * sqrt(2 * g * h) * l / ((M / 3 + m) * l^2)
    unit: rad/s
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { m: 2, h: 0.66, M: 3.6, l: 2.6, g: 9.8 }
  parts:
    - { id: angular-velocity, answer: 0.864583, unit: rad/s, source: P136 }
