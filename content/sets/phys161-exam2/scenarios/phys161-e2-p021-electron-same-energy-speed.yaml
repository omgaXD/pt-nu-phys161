# P21 — an electron with the same kinetic energy as a proton moving at speed v_p:
# ½ m_e v_e² = ½ m_p v_p², so v_e = v_p √(m_p / m_e). The mass ratio 1836 is a physical constant.
# The proton speed stays at or below 1.4×10⁶ m/s so the electron stays well below light speed.
