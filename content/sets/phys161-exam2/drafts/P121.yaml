raw: A 58-kg grindstone is a solid disk 0.5 m in diameter. You press an ax down on the rim with a
  normal force of 160 N. The coefficient of kinetic friction between the blade and the stone is
  0.59, and there is a constant friction torque of 5.5 N⋅m between the axle of the stone and its
  bearings. How much force must be applied tangentially at the end of a crank handle 0.47 m long to
  bring the stone from rest to 140 rev/min in 7 s? (69.99 N)
