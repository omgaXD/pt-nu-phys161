raw: A 57-kg grindstone is a solid disk 0.65 m in diameter. You press an ax down on the rim with a
  normal force of 130 N. The coefficient of kinetic friction between the blade and the stone is
  0.58, and there is a constant friction torque of 6 N⋅m between the axle of the stone and its
  bearings. After the grindstone attains an angular speed of 120 rev/min, what tangential force at
  the end of the handle 0.49 m long is needed to maintain a constant angular speed of 120 rev/min?
  (62.255 N)
