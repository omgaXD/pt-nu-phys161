# P112/P113 — the monkey climbs from rest with constant acceleration a, so the rope pulls it up
# with T = m (g + a). P112: the largest allowed acceleration is T_max / m − g, and covering L from
# rest takes t = √(2L / a). P113: a = 2L / t², so T = m (g + 2L / t²). The constraint keeps P112's
# acceleration clearly positive (T_max clearly above the monkey's weight). g as printed. The two
# source problems use different numbers: the base canonical values are P112's, and P113's part
# overrides them (P112 prints no climbing time and P113 no breaking tension, so each keeps the
# base value of the other).
id: phys161-e1-p112-monkey-climbs-rope
title: Monkey climbing a rope to a banana
source: { document: PHYS161_Exam1, labels: [ P112, P113 ] }
section: Newton's 2nd law
tags: [ newtons-second-law, tension, constant-acceleration, multi-part ]
narrative: >-
  There is a banana at the top of a rope of length {L:unit}. A monkey of mass $m$ = {m:unit} starts
  from rest at the bottom and climbs up to reach the banana. The gravitational acceleration is $g$ =
  {g:unit}.
vars:
  # Lengths are printed as 9.12 and 10: no fixed decimals, so each value prints with the digits it
  # has.
  - { name: L, kind: range, min: 8, max: 12, step: 0.01, unit: m, label: rope length }
  - {
      name: m,
      kind: range,
      min: 9,
      max: 12,
      step: 0.1,
      decimals: 1,
      unit: kg,
      label: monkey mass
    }
  - { name: Tmax, kind: range, min: 120, max: 170, step: 0.01, unit: N, label: breaking tension }
  - {
      name: t,
      kind: range,
      min: 2,
      max: 3.5,
      step: 0.1,
      decimals: 1,
      unit: s,
      label: climbing time
    }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
  - { name: aMax, expr: "Tmax / m - g", unit: m/s^2 } # largest acceleration the rope allows
constraints:
  - "aMax >= 1" # the rope clearly holds the monkey's weight
parts:
  - id: least-time
    prompt: >-
      The rope will snap if the tension exceeds {Tmax:unit}. Calculate the least amount of time the
      monkey could take to reach the banana without breaking the rope. {_0}{_u}
    answer: sqrt(2 * L / aMax)
    unit: s
    tolerance: { rel: 0.01 }
    difficulty: 3
  - id: tension
    prompt: >-
      The monkey climbs to the banana in {t:unit} with constant acceleration. What is the tension in
      the rope? {_0}{_u}
    answer: m * (g + 2 * L / t^2)
    unit: N
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { L: 9.12, m: 10.9, Tmax: 134.07, t: 2.7 }
  parts:
    - { id: least-time, answer: 2.70111, unit: s, source: P112 }
    - { id: tension, answer: 130.452, unit: N, source: P113, vars: { L: 10, m: 10.4 } }
