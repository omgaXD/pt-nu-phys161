# P84/P85 — at the top of the circle the water stays in the bucket as long as gravity alone does
# not exceed the needed centripetal force: v² / R ≥ g, so the minimum speed is √(gR) (P84) and the
# maximum period is 2πR / √(gR) = 2π √(R / g) (P85). R is given in cm and converted to m.
# g as printed. The two source problems use different numbers: the base canonical values are
# P84's, and P85's part overrides them.
id: phys161-e1-p084-bucket-vertical-circle
title: Bucket of water whirled in a vertical circle
source: { document: PHYS161_Exam1, labels: [ P84, P85 ] }
section: Circular motion
tags: [ circular-motion, vertical-circle, unit-conversion, multi-part ]
narrative: >-
  A bucket of water is whirled around a vertical circle of radius {R:unit}. Take the gravitational
  acceleration $g$ = {g:unit}.
vars:
  # Radii are printed as 79.3 cm and 68 cm: no fixed decimals, so each value prints with the
  # digits it has.
  - { name: R, kind: range, min: 55, max: 95, step: 0.1, unit: cm, label: radius }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
  - { name: r, expr: "R / 100", unit: m } # radius in m
parts:
  - id: minimum-speed
    prompt: >-
      What is the minimum speed that the bucket must have at the top of its circular motion if the
      water is not to spill out of the upside-down bucket? {_0}{_u}
    answer: sqrt(g * r)
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: maximum-period
    prompt: >-
      What is the maximum period of revolution the bucket can have if the water is not to spill out
      of the upside-down bucket at the top of the circle? {_0}{_u}
    answer: 2 * pi * sqrt(r / g)
    unit: s
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { R: 79.3 }
  parts:
    - { id: minimum-speed, answer: 2.788, unit: m/s, source: P84 }
    - { id: maximum-period, answer: 1.65509, unit: s, source: P85, vars: { R: 68 } }
