# P43 — uniform deceleration of magnitude a for time t over distance d, starting at speed v0:
# d = v0 t − ½ a t², so v0 = d/t + ½ a t. Constraint: the final speed v0 − a t = d/t − ½ a t stays
# positive (the particle slows down the whole time and never reverses), with a margin.
id: phys161-e1-p043-particle-slowing-initial-speed
title: Initial speed of a decelerating particle
source: { document: PHYS161_Exam1, labels: [ P43 ] }
section: Kinematics of 1D motion
tags: [ kinematics, constant-acceleration, constraints ]
narrative: >-
  A particle slows down uniformly with an acceleration of magnitude {a:unit} for {t:unit} while
  moving in a straight line a distance of {d:unit}.
vars:
  - {
      name: a,
      kind: range,
      min: 0.8,
      max: 1.8,
      step: 0.1,
      decimals: 1,
      unit: m/s^2,
      label: deceleration magnitude
    }
  - { name: t, kind: range, min: 4, max: 7.5, step: 0.1, decimals: 1, unit: s, label: duration }
  - { name: d, kind: range, min: 40, max: 75, step: 1, unit: m, label: distance covered }
derived:
  - { name: vEnd, expr: "d / t - a * t / 2", unit: m/s } # speed at the end of the distance
constraints:
  # The particle must still be moving at the end of the distance (no stop and reversal); keep a
  # margin away from zero.
  - "vEnd > 1"
parts:
  - id: initial-speed
    prompt: "Find the speed of the particle at the beginning of this distance. {_0}{_u}"
    answer: d / t + a * t / 2
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { a: 1.3, t: 5.8, d: 58 }
  parts:
    - { id: initial-speed, answer: 13.77, unit: m/s, source: P43 }
