# P59/P60/P61 — projectile launched at v, θ above the horizontal, up positive, origin at the gun.
# After time t: x = v cos θ · t (P59), y = v sin θ · t − ½ g t² (P60), and the speed is
# |v| = √((v cos θ)² + (v sin θ − g t)²) (P61). g as printed in P60/P61. The shell explodes on
# the mountainside above the gun, so y must stay positive; the constraint also keeps y from being a
# near-zero difference of two large terms. The three source problems use different numbers: the
# base canonical values are P59's, and the other two parts override them.
id: phys161-e1-p059-avalanche-artillery-shell
title: Artillery shell fired to start an avalanche
source: { document: PHYS161_Exam1, labels: [ P59, P60, P61 ] }
section: Kinematics of projectile motion
tags: [ kinematics, projectile-motion, multi-part ]
narrative: >-
  To start an avalanche on a mountain slope, an artillery shell is fired with an initial velocity of
  {v:unit} at {theta}° above the horizontal. It explodes on the mountainside {t:unit} after firing.
  The gravitational acceleration is $g$ = {g:unit}.
vars:
  - { name: v, kind: range, min: 240, max: 360, step: 1, unit: m/s, label: muzzle speed }
  - { name: theta, kind: range, min: 45, max: 70, step: 1, unit: "°", label: launch angle }
  - { name: t, kind: range, min: 28, max: 48, step: 1, unit: s, label: time of flight }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
  - { name: vx, expr: "v * cos(rad(theta))", unit: m/s }
  - { name: vy0, expr: "v * sin(rad(theta))", unit: m/s }
  - { name: y, expr: "vy0 * t - g * t^2 / 2", unit: m }
constraints:
  - "y > 0.05 * vy0 * t" # explodes clearly above the firing point, on the mountainside
parts:
  - id: horizontal-coordinate
    prompt: >-
      What is the horizontal coordinate of the shell where it explodes relative to its firing point?
      {_0}{_u}
    answer: vx * t
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 1
  - id: vertical-distance
    prompt: >-
      What is the vertical distance of the shell where it explodes relative to its firing point?
      {_0}{_u}
    answer: y
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: speed-at-explosion
    prompt: "What is the speed of the shell at the moment it explodes? {_0}{_u}"
    answer: sqrt(vx^2 + (vy0 - g * t)^2)
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { v: 291, theta: 57, t: 46 }
  parts:
    - { id: horizontal-coordinate, answer: 7290.5381227112, unit: m, source: P59 }
    - {
        id: vertical-distance,
        answer: 2556.7818058073,
        unit: m,
        source: P60,
        vars: { v: 301, theta: 61, t: 41 }
      }
    - {
        id: speed-at-explosion,
        answer: 161.174,
        unit: m/s,
        source: P61,
        vars: { v: 296, theta: 62, t: 35 }
      }
