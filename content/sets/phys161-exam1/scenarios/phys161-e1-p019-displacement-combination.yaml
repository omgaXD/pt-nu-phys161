# P19 — magnitude of a linear combination of two displacements: |k D − E|.
# Components are independent integers whose signs match the source (D = (+, +, −),
# E = (+, −, +)), so every component of k D − E keeps its sign and never vanishes.
id: phys161-e1-p019-displacement-combination
title: Magnitude of a combination of two displacements
source: { document: PHYS161_Exam1, labels: [ P19 ] }
section: Vectors
tags: [ vectors, vector-addition, magnitude ]
narrative: >-
  Given the two displacements $\vec{D} = \left({D}\right)\,\text{m}$ and $\vec{E} =
  \left({E}\right)\,\text{m}$.
vars:
  - { name: Dx, kind: range, min: 5, max: 11, step: 1 }
  - { name: Dy, kind: range, min: 6, max: 14, step: 1 }
  - { name: Dz, kind: range, min: -14, max: -6, step: 1 }
  - { name: Ex, kind: range, min: 3, max: 7, step: 1 }
  - { name: Ey, kind: range, min: -5, max: -2, step: 1 }
  - { name: Ez, kind: range, min: 4, max: 10, step: 1 }
  - { name: k, kind: range, min: 2, max: 4, step: 1, label: multiple of D }
derived:
  - { name: D, expr: "[Dx, Dy, Dz]", unit: m }
  - { name: E, expr: "[Ex, Ey, Ez]", unit: m }
parts:
  - id: magnitude
    prompt: >-
      Find the magnitude of the displacement ${k}\vec{D} - \vec{E}$. {_0}{_u}
    answer: norm(k * D - E)
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { Dx: 8, Dy: 10, Dz: -10, Ex: 5, Ey: -3, Ez: 7, k: 2 }
  parts:
    - { id: magnitude, answer: 37.13489, unit: m, source: P19 }
