# P1 — a critical mass m of fissionable material of density ρ forms a sphere:
# V = m/ρ = (4/3)πr³, so r = (3m / (4πρ))^(1/3). The density is given in g/cm³, so the
# mass is converted to g and the radius (in cm) to m inside the formula.
id: phys161-e1-p001-critical-mass-radius
title: Radius of a critical-mass sphere
source: { document: PHYS161_Exam1, labels: [ P1 ] }
section: Units
tags: [ units, density, sphere-volume ]
narrative: >-
  The critical mass of some fissionable material is about {m:unit}. This element has a density of
  {rho:unit}.
vars:
  - { name: m, kind: range, min: 4, max: 8, step: 1, unit: kg, label: critical mass }
  - {
      name: rho,
      kind: range,
      min: 13.0,
      max: 25.0,
      step: 0.1,
      decimals: 1,
      unit: g/cm^3,
      label: density
    }
parts:
  - id: radius
    prompt: >-
      What would be the radius of a sphere of this material that has a critical mass? {_0}{_u}
    # m·1000 g / ρ (g/cm³) → cm³; radius in cm → m.
    answer: (3 * (m * 1000 / rho) / (4 * pi))^(1/3) / 100
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { m: 6, rho: 19.8 }
  parts:
    - { id: radius, answer: 0.04167, unit: m, source: P1 }
