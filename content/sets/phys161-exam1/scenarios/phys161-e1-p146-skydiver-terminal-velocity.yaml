# P146/P147 — at terminal velocity the drag ½ C ρ A v² balances the weight m g:
# v_t = √(2 m g / (C ρ A)) (P146) and A = 2 m g / (C ρ v_t²) (P147). The constraint keeps P147's
# area realistic for a spread-eagle skydiver. g as printed. The two source problems use different
# numbers: the base canonical values are P146's, and P147's part overrides them (P146 prints no
# terminal velocity and P147 no area, so each keeps the base value of the other).
id: phys161-e1-p146-skydiver-terminal-velocity
title: Skydiver's terminal velocity and area
source: { document: PHYS161_Exam1, labels: [ P146, P147 ] }
section: Application of Newton's laws
tags: [ drag, terminal-velocity, inverse, multi-part ]
narrative: >-
  A skydiver of mass {m:unit} falls in a spread-eagle position, with a drag coefficient of $C$ =
  {C}. The density of air is $\rho$ = {rho:unit}. The gravitational acceleration is $g$ = {g:unit}.
vars:
  - { name: m, kind: range, min: 60, max: 90, step: 1, unit: kg, label: skydiver mass }
  # C is printed as 1 and 0.8: no fixed decimals.
  - { name: C, kind: range, min: 0.7, max: 1.1, step: 0.1, label: drag coefficient }
  - {
      name: rho,
      kind: range,
      min: 1.1,
      max: 1.25,
      step: 0.01,
      decimals: 2,
      unit: kg/m^3,
      label: air density
    }
  # A is printed as 0.7: no fixed decimals.
  - {
      name: A,
      kind: range,
      min: 0.5,
      max: 0.9,
      step: 0.01,
      unit: m^2,
      label: cross-sectional area
    }
  - {
      name: vt,
      kind: range,
      min: 35,
      max: 55,
      step: 0.5,
      decimals: 1,
      unit: m/s,
      label: terminal velocity
    }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
  - { name: areaFromVt, expr: "2 * m * g / (C * rho * vt^2)", unit: m^2 } # P147's answer
constraints:
  - "areaFromVt >= 0.4 and areaFromVt <= 1.2" # a realistic spread-eagle area
parts:
  - id: terminal-velocity
    prompt: >-
      The skydiver has a cross-sectional area of $A$ = {A:unit}. Find the terminal velocity of the
      skydiver. {_0}{_u}
    answer: sqrt(2 * m * g / (C * rho * A))
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 3
  - id: cross-sectional-area
    prompt: >-
      The skydiver reaches a terminal velocity of {vt:unit}. What is the skydiver's cross-sectional
      area? {_0}{_u}
    answer: areaFromVt
    unit: m^2
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { m: 72, C: 1, rho: 1.21, A: 0.7, vt: 45.5 }
  parts:
    - { id: terminal-velocity, answer: 40.818, unit: m/s, source: P146 }
    - {
        id: cross-sectional-area,
        answer: 0.738381,
        unit: m^2,
        source: P147,
        vars: { m: 73, C: 0.8, rho: 1.17 }
      }
