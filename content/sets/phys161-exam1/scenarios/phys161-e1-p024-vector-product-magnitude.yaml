# P24 — magnitude of the vector product of two 3-D vectors: |A × B| = |cross(A, B)|.
# Components are independent integers whose signs match the source (A = (+, +, +),
# B = (−, +, −)); since Ax Bx < 0 but Ay By > 0, A and B are never (anti)parallel, so
# |A × B| never vanishes. (The source prints "+ -3k̂"; here it renders as "− 3k̂".)
