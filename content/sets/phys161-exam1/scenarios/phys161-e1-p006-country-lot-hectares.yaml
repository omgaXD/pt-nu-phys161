# P6 — area conversion acres → hectares: A = n · 43600 ft² · (0.3048 m/ft)² / 10⁴ m²/ha.
# The hectare definition (100 m × 100 m), the acre as printed (43600 ft², the source's rounding
# of 43560 ft²) and 1 ft = 0.3048 m are fixed constants (derived); only the lot's area in acres
# is randomized. The answer must be given in "hectares" (exactUnit).
id: phys161-e1-p006-country-lot-hectares
title: Country lot area in hectares
source: { document: PHYS161_Exam1, labels: [ P6 ] }
section: Units
tags: [ units, unit-conversion, area ]
narrative: >-
  A square field measuring 100 m by 100 m has an area of 1 hectare. An acre has an area of 43600
  ft$^{2}$.
vars:
  # Half-acre grid: the source's 12 acres is an integer, but lot sizes like 12.5 acres read
  # naturally and give more variants.
  - { name: n, kind: range, min: 7, max: 17, step: 0.5, label: lot area in acres }
derived:
  - { name: m2PerHa, expr: "100 * 100" } # 1 hectare = 100 m × 100 m
  - { name: ft2PerAcre, expr: "43600" } # as printed in the source
  - { name: mPerFt, expr: "0.3048" } # 1 ft = 0.3048 m
parts:
  - id: area-ha
    prompt: >-
      If a country lot has an area of {n} acres, what is the area in hectares? 1 ft = 0.3048 m. Use
      "hectares" for units in the answer. {_0}{_u}
    answer: n * ft2PerAcre * mPerFt^2 / m2PerHa
    unit: hectares
    exactUnit: true
    tolerance: { rel: 0.01 }
    difficulty: 1
canonical:
  vars: { n: 12 }
  parts:
    - { id: area-ha, answer: 4.86, unit: hectares, source: P6 }
