# P52 — the car starts from rest at the edge of the intersection and accelerates uniformly at a
# across its width d: d = ½ a t², so t = √(2d / a).
id: phys161-e1-p052-car-intersection-from-rest
title: Car crossing an intersection from rest
source: { document: PHYS161_Exam1, labels: [ P52 ] }
section: Kinematics of 1D motion
tags: [ kinematics, constant-acceleration ]
narrative: ""
vars:
  - { name: d, kind: range, min: 16, max: 34, step: 1, unit: m, label: intersection width }
  - {
      name: a,
      kind: range,
      min: 1.6,
      max: 3.2,
      step: 0.1,
      decimals: 1,
      unit: m/s^2,
      label: acceleration
    }
parts:
  - id: crossing-time
    prompt: >-
      How long does it take a car to cross a {d:unit}-wide intersection after the light turns green,
      if the car accelerates from rest at a constant acceleration of {a:unit}? {_0}{_u}
    answer: sqrt(2 * d / a)
    unit: s
    tolerance: { rel: 0.01 }
    difficulty: 1
canonical:
  vars: { d: 25, a: 2.4 }
  parts:
    - { id: crossing-time, answer: 4.5643546458764, unit: s, source: P52 }
