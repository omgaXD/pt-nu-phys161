# P29 — the ride is split into two equal halves d1. The total time is 2 d1 / v_avg and the first
# half takes d1 / v1, so the second half needs v2 = d1 / (2 d1 / v_avg − d1 / v1).
# Speeds stay in km/h (the answer must be given in km/h: exactUnit).
id: phys161-e1-p029-bike-ride-average-speed
title: Average speed over the second half of a bike ride
source: { document: PHYS161_Exam1, labels: [ P29 ] }
section: Kinematics of 1D motion
tags: [ kinematics, average-speed ]
narrative: >-
  On a {d:unit} bike ride, the first {d1:unit} were covered at an average speed of {v1:unit}.
vars:
  - { name: d1, kind: range, min: 15, max: 29, step: 1, unit: km, label: length of each half }
  - {
      name: v1,
      kind: range,
      min: 8,
      max: 16,
      step: 1,
      unit: km/h,
      label: speed on the first half
    }
  - {
      name: vavg,
      kind: range,
      min: 4,
      max: 8,
      step: 1,
      unit: km/h,
      label: required average speed
    }
derived:
  - { name: d, expr: "2 * d1", unit: km } # total ride: two equal halves, as in the source
constraints:
  # As in the source, the first half is faster than the target average (so the second half is
  # slower); this also keeps 2/vavg − 1/v1 > 0, i.e. the target is reachable at all.
  - "v1 > vavg"
parts:
  - id: second-half-speed
    prompt: >-
      What must the average speed over the next {d1:unit} be to have your average speed for the
      total {d:unit} be {vavg:unit}? Use "km/h" units in the answer. {_0}{_u}
    answer: d1 / (d / vavg - d1 / v1)
    unit: km/h
    exactUnit: true
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { d1: 22, v1: 12, vavg: 6 }
  parts:
    - { id: second-half-speed, answer: 4, unit: km/h, source: P29 }
