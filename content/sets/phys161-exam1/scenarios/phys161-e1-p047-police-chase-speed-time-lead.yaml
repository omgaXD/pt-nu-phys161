# P47/P48/P49 — the motorist moves at constant v, the officer starts from rest at the corner
# with constant acceleration a at the same instant: v t = ½ a t² gives the catch-up time
# t = 2v/a (the non-zero root, always positive; P48); the officer's speed then is a t = 2v (P47).
# The lead v t − ½ a t² is largest when the speeds are equal, t = v/a, and equals v²/(2a) (P49).
# The speed limit is data no answer uses (P49's source text omits it). Variables and ranges as in
# P46. The three source problems use different numbers: the base canonical values are P47's, and
# the other two parts override them (P49 prints no speed limit, so it keeps the base value).
id: phys161-e1-p047-police-chase-speed-time-lead
title: Police motorcycle chasing a speeding motorist
source: { document: PHYS161_Exam1, labels: [ P47, P48, P49 ] }
section: Kinematics of 1D motion
tags: [ kinematics, constant-acceleration, pursuit, multi-part ]
narrative: >-
  A motorist traveling with a constant speed of {v:unit} passes a school-crossing corner, where the
  speed limit is {vLimit:unit}. Just as the motorist passes, a police officer on a motorcycle
  standing at the corner starts off in pursuit with constant acceleration of {a:unit}.
vars:
  - { name: v, kind: range, min: 13, max: 24, step: 1, unit: m/s, label: motorist speed }
  - { name: vLimit, kind: range, min: 8, max: 14, step: 1, unit: m/s, label: speed limit }
  - {
      name: a,
      kind: range,
      min: 3,
      max: 6,
      step: 0.1,
      decimals: 1,
      unit: m/s^2,
      label: officer acceleration
    }
derived:
  - { name: tCatch, expr: "2 * v / a", unit: s } # non-zero root of v t = ½ a t²
constraints:
  - "v > vLimit + 2" # the motorist is clearly speeding, as in the source
parts:
  - id: officer-speed
    prompt: >-
      What is the officer's speed at the moment he catches up with the motorist? {_0}{_u}
    answer: a * tCatch
    unit: m/s
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: catch-up-time
    prompt: "How much time elapses before the officer catches up with the motorist? {_0}{_u}"
    answer: tCatch
    unit: s
    tolerance: { rel: 0.01 }
    difficulty: 2
  - id: max-lead
    prompt: >-
      What is the maximum distance by which the motorist gets ahead of the officer? {_0}{_u}
    answer: v^2 / (2 * a)
    unit: m
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { v: 18, vLimit: 10, a: 3.6 }
  parts:
    - { id: officer-speed, answer: 36, unit: m/s, source: P47 }
    - { id: catch-up-time, answer: 7.2727272727273, unit: s, source: P48, vars: { v: 16, a: 4.4 } }
    - { id: max-lead, answer: 33.75, unit: m, source: P49, vars: { v: 18, a: 4.8 } }
