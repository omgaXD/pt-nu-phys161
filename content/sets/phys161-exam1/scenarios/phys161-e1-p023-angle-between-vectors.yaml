# P23 — angle between two 3-D vectors: θ = arccos(A · B / (|A| |B|)), in radians (exactUnit).
# Components are independent integers whose signs match the source (A = (+, +, +),
# B = (−, +, −)); arccos returns θ in [0, π], so no quadrant convention can flip. The constraint
# keeps A · B < 0, i.e. the angle obtuse as in the source (and never exactly π/2).
# (The source prints B's y-component as "+ 1ĵ"; it stays in the range 1–3.)
id: phys161-e1-p023-angle-between-vectors
title: Angle between two vectors from their components
source: { document: PHYS161_Exam1, labels: [ P23 ] }
section: Vectors
tags: [ vectors, scalar-product, angle ]
narrative: ""
vars:
  - { name: Ax, kind: range, min: 3, max: 6, step: 1 }
  - { name: Ay, kind: range, min: 3, max: 7, step: 1 }
  - { name: Az, kind: range, min: 2, max: 4, step: 1 }
  - { name: Bx, kind: range, min: -4, max: -2, step: 1 }
  - { name: By, kind: range, min: 1, max: 3, step: 1 }
  - { name: Bz, kind: range, min: -5, max: -3, step: 1 }
derived:
  - { name: A, expr: "[Ax, Ay, Az]" }
  - { name: B, expr: "[Bx, By, Bz]" }
constraints:
  - "dot(A, B) < 0" # obtuse angle, as in the source
parts:
  - id: angle
    prompt: >-
      Find the angle (in radians) between the two vectors $\vec{A} = \left({A}\right)$ and $\vec{B}
      = \left({B}\right)$. {_0}{_u}
    answer: acos(dot(A, B) / (norm(A) * norm(B)))
    unit: rad
    exactUnit: true
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { Ax: 4, Ay: 5, Az: 3, Bx: -2, By: 1, Bz: -4 }
  parts:
    - { id: angle, answer: 2.0521, unit: rad, source: P23 }
