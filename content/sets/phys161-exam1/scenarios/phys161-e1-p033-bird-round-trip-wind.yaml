# P33 — round trip A-B-A against then along a steady wind w, bird airspeed u:
# v_avg = 2d / (d/(u − w) + d/(u + w)) = (u² − w²) / u (independent of d).
# The airspeed is given in km/h and the wind in m/s; the answer must be in m/s (exactUnit).
id: phys161-e1-p033-bird-round-trip-wind
title: Bird's round trip in a steady wind
source: { document: PHYS161_Exam1, labels: [ P33 ] }
section: Kinematics of 1D motion
tags: [ kinematics, average-speed, relative-velocity, unit-conversion ]
narrative: >-
  Locations A and B are {d:unit} apart and a bird is making a round trip A-B-A. When traveling from
  A to B, the bird flies against the wind, while on the return trip it goes along the wind. The
  speed of the bird in stationary air is {vb:unit}.
vars:
  - { name: d, kind: range, min: 13, max: 25, step: 1, unit: km, label: distance A to B }
  - { name: vb, kind: range, min: 22, max: 42, step: 1, unit: km/h, label: bird airspeed }
  - { name: w, kind: range, min: 1.4, max: 2.8, step: 0.1, decimals: 1, unit: m/s, label: wind }
derived:
  - { name: msPerKmh, expr: "1000 / 3600" } # 1 km/h = 1/3.6 m/s
  - { name: mPerKm, expr: "1000" } # 1 km = 1000 m
  - { name: u, expr: "vb * msPerKmh", unit: m/s } # bird airspeed in m/s
constraints:
  # The bird must make headway against the wind (always true on these ranges: u ≥ 6.1 m/s).
  - "u > w"
parts:
  - id: average-speed
    prompt: >-
      Determine the average speed of the bird with respect to the ground in the round trip if the
      wind had a constant speed of {w:unit} for the entire time. Provide the answer in units m/s.
      {_0}{_u}
    answer: 2 * d * mPerKm / (d * mPerKm / (u - w) + d * mPerKm / (u + w))
    unit: m/s
    exactUnit: true
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { d: 19, vb: 32, w: 2.1 }
  parts:
    - { id: average-speed, answer: 8.3927638888889, unit: m/s, source: P33 }
