# P127–P130 — m₁ on the incline, cord over the pulley to the hanging m₂. Along the incline gravity
# pulls m₁ down with m₁ g sin α, and kinetic friction μ_k m₁ g cos α opposes the motion.
#   up at constant speed:   T = m₁ g (sin α + μ_k cos α) (P130) = m₂ g,
#                           so m₂ = m₁ (sin α + μ_k cos α) (P127)
#   down at constant speed: m₂ = m₁ (sin α − μ_k cos α) (P128; positive on these ranges)
#   up with acceleration a: m₂ g − T = m₂ a and T − m₁ g (sin α + μ_k cos α) = m₁ a, so
#                           m₂ = m₁ (g (sin α + μ_k cos α) + a) / (g − a) (P129)
# g as printed in P129/P130 (it cancels in P127/P128). The four source problems use different
# numbers: the base canonical values are P127's, and the other parts override them.
id: phys161-e1-p127-incline-pulley-hanging-block
title: Block on an incline tied to a hanging block
source: { document: PHYS161_Exam1, labels: [ P127, P128, P129, P130 ] }
section: Application of Newton's laws
tags: [ friction, kinetic-friction, incline, pulley, tension, multi-part ]
figure:
  id: fig
  src: figures/unnamed_018_R6Ld.png
  alt: >-
    A block m1 rests on a plane inclined at angle α to the horizontal. A cord runs from m1 up along
    the incline to a pulley at the top and hangs down from the pulley to a block m2.
narrative: >-
  A block with mass $m_1$ = {m1:unit} is placed on an inclined plane with slope angle $\alpha$ =
  {alpha}° and is connected to a second hanging block with mass $m_2$ by a cord passing over a
  small, frictionless pulley. The coefficient of kinetic friction between $m_1$ and the incline is
  {mu}. The gravitational acceleration is $g$ = {g:unit}. {@fig}
vars:
  - { name: m1, kind: range, min: 140, max: 300, step: 5, unit: kg, label: block on the incline }
  - { name: alpha, kind: range, min: 25, max: 45, step: 1, unit: "°", label: slope angle }
  # Coefficients are printed as 0.09, 0.076, 0.12 and 0.07: no fixed decimals, so each value
  # prints with the digits it has.
  - {
      name: mu,
      kind: range,
      min: 0.05,
      max: 0.15,
      step: 0.001,
      label: coefficient of kinetic friction
    }
  - {
      name: a,
      kind: range,
      min: 0.8,
      max: 2,
      step: 0.1,
      decimals: 1,
      unit: m/s^2,
      label: acceleration up the plane
    }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
  - { name: kUp, expr: "sin(rad(alpha)) + mu * cos(rad(alpha))" } # gravity + friction, per m₁ g
  - { name: kDown, expr: "sin(rad(alpha)) - mu * cos(rad(alpha))" } # gravity − friction, per m₁ g
parts:
  - id: mass-up-constant-speed
    prompt: >-
      Find the mass $m_2$ for which block $m_1$ moves up the plane at constant speed once it is set
      in motion. {_0}{_u}
    answer: m1 * kUp
    unit: kg
    tolerance: { rel: 0.01 }
    difficulty: 3
  - id: mass-down-constant-speed
    prompt: >-
      Find the mass $m_2$ for which block $m_1$ moves down the plane at constant speed once it is
      set in motion. {_0}{_u}
    answer: m1 * kDown
    unit: kg
    tolerance: { rel: 0.01 }
    difficulty: 3
  - id: mass-up-accelerating
    prompt: >-
      Find the mass $m_2$ for which $m_1$ moves up the plane with a constant acceleration of
      {a:unit}. {_0}{_u}
    answer: m1 * (g * kUp + a) / (g - a)
    unit: kg
    tolerance: { rel: 0.01 }
    difficulty: 4
  - id: tension-up-constant-speed
    prompt: >-
      Find the tension in the cord for which $m_1$ moves up the plane at constant speed once it is
      set in motion. {_0}{_u}
    answer: m1 * g * kUp
    unit: N
    tolerance: { rel: 0.01 }
    difficulty: 3
canonical:
  vars: { m1: 280, alpha: 39, mu: 0.09, a: 1.3 }
  parts:
    - { id: mass-up-constant-speed, answer: 195.7938, unit: kg, source: P127 }
    - {
        id: mass-down-constant-speed,
        answer: 62.75,
        unit: kg,
        source: P128,
        vars: { m1: 150, alpha: 29, mu: 0.076 }
      }
    - {
        id: mass-up-accelerating,
        answer: 165.928,
        unit: kg,
        source: P129,
        vars: { m1: 185, alpha: 33, mu: 0.12 }
      }
    - {
        id: tension-up-constant-speed,
        answer: 1590.14,
        unit: N,
        source: P130,
        vars: { m1: 225, alpha: 42, mu: 0.07 }
      }
