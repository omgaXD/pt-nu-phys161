# P117 — the scale pushes up with N and gravity pulls down with m g: N − m g = m a, so
# a = N / m − g. The constraint keeps a between 0.5 and 4 m/s² (the elevator accelerates upward).
# g as printed.
id: phys161-e1-p117-elevator-scale-acceleration
title: Elevator acceleration from a scale reading
source: { document: PHYS161_Exam1, labels: [ P117 ] }
section: Newton's 2nd law
tags: [ newtons-second-law, apparent-weight, elevator ]
narrative: >-
  A man of mass {m:unit} stands on a weighing scale in an elevator that is accelerating upward. The
  scale reads {N:unit}. The gravitational acceleration is $g$ = {g:unit}.
vars:
  - {
      name: m,
      kind: range,
      min: 65,
      max: 85,
      step: 0.5,
      decimals: 1,
      unit: kg,
      label: man's mass
    }
  - { name: N, kind: range, min: 800, max: 1000, step: 1, unit: N, label: scale reading }
derived:
  - { name: g, expr: "9.8", unit: m/s^2 }
  - { name: a, expr: "N / m - g", unit: m/s^2 }
constraints:
  - "a >= 0.5 and a <= 4" # a clear, realistic upward acceleration
parts:
  - id: acceleration
    prompt: "Find the magnitude of the acceleration of the elevator. {_0}{_u}"
    answer: a
    unit: m/s^2
    tolerance: { rel: 0.01 }
    difficulty: 2
canonical:
  vars: { m: 73.5, N: 925 }
  parts:
    - { id: acceleration, answer: 2.78503, unit: m/s^2, source: P117 }
