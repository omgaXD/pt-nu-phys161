raw: >-
  A hammer is hanging by a light rope from the ceiling of a bus. The ceiling of the bus is parallel
  to the roadway. The bus is traveling in a straight line on a horizontal street. You observe that
  the hammer hangs at rest with respect to the bus when the angle between the rope and the ceiling
  of the bus is 69°. What is the acceleration of the bus? The gravitational acceleration is g

  = 9.8 m/s<sup>2</sup>. (3.7618675 m/s^2)
